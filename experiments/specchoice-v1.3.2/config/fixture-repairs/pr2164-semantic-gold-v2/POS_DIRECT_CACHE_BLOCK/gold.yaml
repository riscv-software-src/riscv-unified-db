$schema: param_schema.json#
kind: parameter
name: CACHE_BLOCK_SIZE
long_name: Cache block size
description: |
  Observable size of a cache block in bytes. The size of a cache block is
  implementation-specific. Cache blocks represent a contiguous, naturally
  aligned power-of-two (NAPOT) range of memory locations.

  Modeling note: maximum is omitted intentionally — the challenge snippet does
  not state an upper bound (contrast some UDB encodings that use 2**64-1 as a
  stand-in for "unbounded").
definedBy:
  extension:
    anyOf:
      - name: Zicbom
      - name: Zicbop
      - name: Zicboz
schema:
  type: integer
  enum:
    [
      0x1, 0x2, 0x4, 0x8, 0x10, 0x20, 0x40, 0x80, 0x100, 0x200,
      0x400, 0x800, 0x1000, 0x2000, 0x4000, 0x8000, 0x10000, 0x20000,
