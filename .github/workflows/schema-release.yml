# This workflow creates GitHub releases for schema files.
# It runs after the CI/CD workflow completes successfully on the main branch.
# Each schema version gets its own release tag (e.g., schemas/<schema_name>/<version>).
# Published schema version assets are immutable; if content changes, bump the
# schema $id so a new release tag is created.

name: Schema Release

on:
  workflow_run:
    workflows: [CI/CD]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-schemas:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Clone Github Repo Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise environment
        uses: ./.github/actions/mise-setup

      - name: Generate resolved schemas
        run: ./do gen:schemas

      - name: Publish changed schema versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/python tools/scripts/publish_schemas.py
