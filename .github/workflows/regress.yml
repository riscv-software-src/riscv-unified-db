name: CI

permissions:
  contents: read
  packages: read

on:
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  push:
    branches:
      - main

env:
  UDB_REQUIRE_TOOLS: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-fast:
    name: Python ${{ matrix.python }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python and mise environment
        uses: ./.github/actions/mise-setup
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and specification tests
        run: mise run test

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Run pre-commit checks
        run: mise run check:pre-commit

  llvm:
    name: LLVM instruction data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 1
      - name: Initialize LLVM
        run: git submodule update --init --recursive --depth=1 ext/llvm-project
      - name: Set up mise and the native toolchain
        uses: ./.github/actions/mise-setup
        with:
          toolchain: 'true'
      - name: Build llvm-tblgen and test generated instruction data
        run: mise run test:llvm

  java-tests:
    name: Java (Xtext) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/eclipse/dev/org.xtext.udb.parent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test the reactor
        env:
          MAVEN_OPTS: >-
            -Djdk.xml.maxGeneralEntitySizeLimit=0
            -Djdk.xml.totalEntitySizeLimit=0
            -Djdk.xml.entityExpansionLimit=0
        run: mise run test:java
      - name: Archive Surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt

  vscode-tests:
    name: VS Code tests
    runs-on: ubuntu-latest
    needs: java-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run VS Code tests
        run: mise run test:vscode
      - name: Archive VS Code test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-test-logs
          path: |
            tools/eclipse/udb-vscode/.vscode-test/**/*
            tools/eclipse/udb-vscode/out/test/**/*

  python-slow-idl:
    name: Slow IDL (${{ matrix.config }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        config: ['_', rv32, rv64, qc_iu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Type-check real IDL bodies
        run: mise run test:slow:idl -- --config "${{ matrix.config }}"

  python-slow-idl-passes:
    name: Slow IDL passes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Run real-spec IDL pass goldens
        run: mise run test:slow:idl-passes

  python-slow-idl-conditions:
    name: Slow IDL conditions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Run real-spec IDL condition manifest
        run: mise run test:slow:idl-conditions

  python-slow-idl-environment:
    name: Slow IDL environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Run real-spec IDL environment checks
        run: mise run test:slow:idl-environment

  python-slow-architecture:
    name: Slow architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Run full architecture checks
        run: mise run test:slow:architecture

  python-slow-prose:
    name: Slow configured prose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Run configured-prose goldens
        run: mise run test:slow:prose

  python-slow-generators:
    name: Slow generated-source consumers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install source acceptance tools
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends
          gcc golang-go verilator
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Compile and lint generated sources
        run: mise run test:slow:generators

  python-slow-extension-pdf:
    name: Slow extension PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Install the external PDF renderer
        run: gem install --no-document asciidoctor-pdf -v 2.3.19
      - name: Render and inspect extension PDFs
        run: mise run test:slow:extension-pdf

  python-slow-layouts:
    name: Slow layouts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Check complete standard and custom layouts
        run: mise run test:slow:layouts

  python-package:
    name: Python package acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python and mise environment
        uses: ./.github/actions/mise-setup
        with:
          python-version: '3.14'
      - name: Build and test wheel and source distribution offline
        run: mise run test:package

  cpp-hart:
    name: C++ hart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise and the native toolchain
        uses: ./.github/actions/mise-setup
        with:
          toolchain: 'true'
      - name: Build and test the C++ hart
        run: mise run test:cpp-hart -- -c rv64

  native-bits:
    name: Native Bits tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise and the native toolchain
        uses: ./.github/actions/mise-setup
        with:
          toolchain: 'true'
      - name: Run native Bits tests
        run: mise run test:native-bits

  softfloat:
    name: SoftFloat tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise and the native toolchain
        uses: ./.github/actions/mise-setup
        with:
          toolchain: 'true'
      - name: Run SoftFloat tests
        run: mise run test:softfloat

  riscv-tests-32:
    name: RISC-V architecture tests (RV32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise and the native toolchain
        uses: ./.github/actions/mise-setup
        with:
          toolchain: 'true'
      - name: Run RV32 architecture tests
        run: mise run test:riscv-tests -- -c rv32

  riscv-tests-64:
    name: RISC-V architecture tests (RV64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise and the native toolchain
        uses: ./.github/actions/mise-setup
        with:
          toolchain: 'true'
      - name: Run RV64 architecture tests
        run: mise run test:riscv-tests -- -c rv64

  riscv-tests-vector:
    name: RISC-V vector architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise and the native toolchain
        uses: ./.github/actions/mise-setup
        with:
          toolchain: 'true'
      - name: Run vector architecture tests
        run: mise run test:riscv-vector-tests -- -c rv64

  schema:
    name: Schema publication checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Check published schema versions
        run: mise run check:schema-versions
      - name: Check schema documentation drift
        run: mise run gen:schema-docs -- --check

  build-reuse-manifest:
    name: Build REUSE manifest
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref_name == 'main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Build REUSE manifest
        run: mise run artifact:reuse-manifest
      - name: Upload REUSE manifest
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reuse-manifest
          path: reuse_bom.txt

  resolve-unconfig:
    name: Build unconfigured resolved database
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref_name == 'main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Resolve the unconfigured database
        run: mise run artifact:resolved-unconfigured
      - name: Upload resolved database
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resolved-spec
          path: gen/resolved_spec/_
          include-hidden-files: true

  build-docs-site:
    name: Build documentation site
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref_name == 'main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Build documentation site
        run: mise run docs:build site
      - name: Upload documentation site
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-site
          path: doc/build

  regress-complete:
    name: CI complete
    runs-on: ubuntu-latest
    if: always()
    needs:
      - python-fast
      - pre-commit
      - llvm
      - java-tests
      - vscode-tests
      - python-slow-idl
      - python-slow-idl-passes
      - python-slow-idl-conditions
      - python-slow-idl-environment
      - python-slow-architecture
      - python-slow-prose
      - python-slow-generators
      - python-slow-extension-pdf
      - python-slow-layouts
      - python-package
      - cpp-hart
      - native-bits
      - softfloat
      - riscv-tests-32
      - riscv-tests-64
      - riscv-tests-vector
      - schema
      - build-reuse-manifest
      - resolve-unconfig
      - build-docs-site
    steps:
      - name: Fail if any required job failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Confirm all required jobs passed
        if: >-
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled')
        run: exit 0
