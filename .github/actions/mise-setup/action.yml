name: mise setup
description: Set up mise environment and install project dependencies
inputs:
  python-version:
    description: Python version used to create the repository virtual environment
    default: '3.14'
  toolchain:
    description: Whether to pull/build the RISC-V toolchain container (for C++ jobs)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        UV_PYTHON: ${{ inputs.python-version }}
      with:
        version: 2026.9.13
    # Write the toolchain preference before bin/setup runs.
    - name: Configure toolchain
      shell: bash
      run: |
        if [[ "${{ inputs.toolchain }}" == "true" ]]; then
          echo "UDB_TOOLCHAIN_CONTAINER=1" > .toolchain-local
          echo "UDB_TOOLCHAIN_CONTAINER=1" >> "$GITHUB_ENV"
        else
          echo "UDB_TOOLCHAIN_NONE=1" > .toolchain-local
          echo "UDB_TOOLCHAIN_NONE=1" >> "$GITHUB_ENV"
        fi
    # Docker Buildx must be available before bin/setup runs. The setup script
    # can call _pull_or_build_toolchain_image, which uses buildx in CI.
    - name: Set up Docker Buildx
      if: inputs.toolchain == 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GHCR
      if: inputs.toolchain == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    # Cache downloaded packages only; let uv and aube use their normal install
    # locations in the workspace/environment.
    - name: Cache uv packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
    - name: Cache aube packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.local/share/aube/store
        key: aube-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json', 'tools/eclipse/udb-vscode/package-lock.json', 'tools/eclipse/udb-vscode/package.json') }}
    - name: Set up environment and install dependencies
      shell: bash
      env:
        UV_PYTHON: ${{ inputs.python-version }}
      run: ./bin/setup
