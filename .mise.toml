# Tool versions managed by mise (https://mise.jdx.dev)

[tools]
prek = "0.5.3"
aube = "2.4.0"
uv = "0.12.19"
cmake = "4.4.3"
make = "4.4.1"
shellcheck = "0.11.0"
"github-cli" = "2.101.0"

[deps.uv]
auto = true

[deps.npm]
auto = true
run = "aube ci"

[deps.prek]
auto = true
sources = [".pre-commit-config.yaml"]
run = "prek install --prepare-hooks"

[task_config]
includes = [
  "tools/dev/tasks.toml",
]

[settings]
experimental = true                            # Needed for deps feature
idiomatic_version_file_enable_tools = ["node"]
