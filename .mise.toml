# Tool versions managed by mise (https://mise.jdx.dev)

[tools]
ruby = "3.4.10"
prek = "0.5.2"
aube = "2.2.4"
uv = "0.12.10"
cmake = "4.4.3"
make = "4.4.1"
shellcheck = "0.11.0"
"github-cli" = "2.100.0"

[env]
RUBY_YJIT_ENABLE = "1"
# Disable the CHECKSUMS section in lockfiles — checksums can't be fully populated
# across all platforms (e.g. aarch64 variants on an x86 machine) so we opt out entirely.
BUNDLE_LOCKFILE_CHECKSUMS = "false"

[deps.bundler]
auto = true

[deps.uv]
auto = true

[deps.npm]
auto = true
run = "aube ci"

[deps.git-submodule]
auto = true
outputs = ["ext/rbi-central/README.md"]
run = "git submodule update --init ext/rbi-central"

[deps.prek]
auto = true
sources = [".pre-commit-config.yaml"]
run = "prek install --prepare-hooks"

[deps.native]
auto = true
sources = [
  "tools/ruby-gems/udb/ext/udb_download/extconf.rb",
  "tools/ruby-gems/udb/lib/udb/dep_versions.rb",
  "tools/ruby-gems/udb/lib/udb/*_VERSION",
]
outputs = ["gen/.mise-native-deps"]
run = '''
mkdir -p gen &&
(cd tools/ruby-gems/udb/ext/udb_download && ruby extconf.rb) &&
touch gen/.mise-native-deps
'''

[hooks]
# Temporary migration shim for existing users with legacy git hooks
postinstall = { shell = "bash -c", run = '''
root="${MISE_PROJECT_ROOT:-$PWD}"
git_hooks_dir=$(git -C "$root" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) || exit 0

remove_legacy_hook() {
  hook_path="$git_hooks_dir/hooks/$1"
  [ -f "$hook_path" ] || return 0

  if grep -qF 'ROOT=$(git rev-parse --show-toplevel)' "$hook_path" &&
    grep -qF 'running mise install...' "$hook_path" &&
    { grep -qF 'running bundle install...' "$hook_path" ||
      grep -qF 'Dependency files changed — running mise deps...' "$hook_path"; }; then
    rm -f "$hook_path"
    echo "mise: removed legacy $1 hook"
  fi

  return 0
}

remove_legacy_hook post-merge
remove_legacy_hook post-checkout
''' }

[settings]
experimental = true                            # Needed for deps feature
idiomatic_version_file_enable_tools = ["node"]
ruby.compile = false
ruby.default_packages_file = ".default-gems"
