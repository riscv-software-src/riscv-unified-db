# SPDX-License-Identifier: BSD-3-Clause-Clear

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "udb"
version = "0.1.0a0"
description = "Python access to the RISC-V Unified Database"
readme = "doc/python-api.md"
requires-python = ">=3.12"
license = "BSD-3-Clause-Clear AND CC-BY-4.0 AND BSD-2-Clause AND MIT AND OFL-1.1 AND mplus"
license-files = ["LICENSE-BSD-3-Clause-Clear.txt", "LICENSE-CC-BY.txt", "LICENSES/BSD-2-Clause.txt", "LICENSES/OFL-1.1.txt", "LICENSES/mplus.txt", "LICENSE-MIT.txt", "NOTICE", "REUSE.toml", "src/udb/schema_docs/NOTICE", "src/udb/cpp_hart/NOTICE", "src/udb/extension_docs/assets/NOTICE.txt", "src/udb/extension_docs/assets/fonts/OFL-M.txt", "src/udb/extension_docs/assets/fonts/OFL-P.txt", "src/udb/extension_docs/assets/fonts/LICENSE-mplus.txt"]
authors = [{ name = "RISC-V UnifiedDB contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
    "ruamel.yaml>=0.19.1",
    "typer>=0.20.0",
    "z3-solver>=4.13,<5",
]

[project.scripts]
udb = "udb.cli:main"

[project.urls]
Homepage = "https://github.com/riscv/riscv-unified-db"
Issues = "https://github.com/riscv/riscv-unified-db/issues"

[dependency-groups]
dev = [
    "build>=1.3",
    "deepmerge>=2.1.0",
    "hatchling>=1.27",
    "pytest==9.1.1",
    "pytest-xdist>=3.8.0",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "reuse==6.2.0",
    "ruff==0.16.9",
    "tqdm>=4.67.3",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/udb"]

[tool.hatch.build.targets.sdist]
include = [
    "/.toolchain/check_cxx.cmake",
    "/.toolchain/.build-elfutils.sh",
    "/backends/cpp_hart_gen/CMakeLists.txt",
    "/backends/cpp_hart_gen/c/include/udb/*.h",
    "/backends/cpp_hart_gen/cpp/include/udb/*.hpp",
    "/backends/cpp_hart_gen/cpp/src/*.cpp",
    "/backends/cpp_hart_gen/cpp/test/*.cmake",
    "/backends/cpp_hart_gen/cpp/test/*.cpp",
    "/backends/cpp_hart_gen/cpp/test/*.hpp",
    "/backends/cpp_hart_gen/gdb/*.xml",
    "/backends/cpp_hart_gen/renode/*.cs",
    "/backends/cpp_hart_gen/renode/*.repl",
    "/backends/cpp_hart_gen/renode/*.resc",
    "/cfgs/_.yaml",
    "/cfgs/rv32.yaml",
    "/cfgs/rv64.yaml",
    "/cfgs/rv64-riscv-tests.yaml",
    "/LICENSE-BSD-3-Clause-Clear.txt",
    "/LICENSE-CC-BY.txt",
    "/LICENSES/BSD-2-Clause.txt",
    "/LICENSES/OFL-1.1.txt",
    "/LICENSES/mplus.txt",
    "/LICENSE-MIT.txt",
    "/NOTICE",
    "/REUSE.toml",
    "/doc/python-api.md",
    "/doc/stage5-configured-prose.md",
    "/hatch_build.py",
    "/pyproject.toml",
    "/src/udb",
    "/tests/python/query_reports_installed_acceptance.py",
    "/tests/python/fixtures/query_reports/**/*",
    "/spec/schemas/**/*.json",
    "/spec/schemas/**/*.yaml",
    "/spec/std/isa/**/*.adoc",
    "/spec/std/isa/**/*.idl",
    "/spec/std/isa/**/*.isa",
    "/spec/std/isa/**/*.layout",
    "/spec/std/isa/**/*.yaml",
    "/spec/custom/isa/qc_iu/csr/Xqci/qc.mclicipN.layout",
    "/spec/custom/isa/qc_iu/csr/Xqci/qc.mclicieN.layout",
    "/spec/custom/isa/qc_iu/csr/Xqci/qc.mclicilvlN.layout",
    "/spec/custom/isa/qc_iu/csr/Xqci/qc.mwpstartaddrN.layout",
    "/spec/custom/isa/qc_iu/csr/Xqci/qc.mwpendaddrN.layout",
    "/spec/custom/isa/qc_iu/csr/Xqci/qc.mclicip[0-7].yaml",
    "/spec/custom/isa/qc_iu/csr/Xqci/qc.mclicie[0-7].yaml",
    "/spec/custom/isa/qc_iu/csr/Xqci/qc.mclicilvl[0-2][0-9].yaml",
    "/spec/custom/isa/qc_iu/csr/Xqci/qc.mclicilvl3[01].yaml",
    "/spec/custom/isa/qc_iu/csr/Xqci/qc.mwpstartaddr[0-3].yaml",
    "/spec/custom/isa/qc_iu/csr/Xqci/qc.mwpendaddr[0-3].yaml",
    "/tests/data/fp/directed/f32_fpgen_expanded.jsonl",
]

[tool.ruff]
line-length = 100
extend-exclude = [ "ext" ]

[tool.pytest.ini_options]
addopts = "-n auto -m 'not slow and not package' --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: expensive real-spec, renderer, compiler, or native acceptance",
    "package: build or installed-artifact acceptance",
    "needs_tool(name): requires an external executable",
]

[tool.ruff.lint]
extend-select = [
    "A005",   # flake8-builtins: stdlib module shadowing
    "B007",   # flake8-bugbear: unused loop control variable
    "B011",   # flake8-bugbear: assert False
    "B034",   # flake8-bugbear: regex positional args
    "E713",   # pycodestyle: not in
    "E714",   # pycodestyle: is not
    "E721",   # pycodestyle: direct type comparisons
    "EXE003", # flake8-executable: Python shebangs
    "F403",   # pyflakes: star import analysis blind spot
    "F405",   # pyflakes: possibly undefined from star import
    "F406",   # pyflakes: star import only at module level
    "F722",   # pyflakes: forward annotation syntax error
    "RUF001", # ruff: ambiguous Unicode in strings
    "RUF002", # ruff: ambiguous Unicode in docstrings
    "RUF003", # ruff: ambiguous Unicode in comments
    "RUF006", # ruff: dangling asyncio task
    "RUF021", # ruff: mixed and/or precedence
    "RUF043", # ruff: pytest raises match ambiguity
    "RUF061", # ruff: pytest raises/warns context manager
    "RUF064", # ruff: non-octal permissions
    "RUF102", # ruff: invalid rule code
    "RUF103", # ruff: invalid suppression comment
    "RUF104", # ruff: unmatched suppression comment
    "W191",   # pycodestyle: tabs in indentation
]
