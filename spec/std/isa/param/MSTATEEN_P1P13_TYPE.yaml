# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: MSTATEEN_P1P13_TYPE
description: |
  Behavior of the `mstateen0.P1P13` bit, which controls access to `hedelegh`:

    * 'rw': read-write
    * 'read-only-0': read-only, fixed to 0
    * 'read-only-1': read-only, fixed to 1

  `hedelegh` exists only when XLEN is 32 and the hypervisor extension is implemented.
  Otherwise, `mstateen0.P1P13` is read-only zero and this parameter does not exist.
long_name: Behavior of mstateen0.P1P13
schema:
  type: string
  enum:
    - rw
    - read-only-0
    - read-only-1
definedBy:
  allOf:
    - xlen: 32
    - extension:
        allOf:
          - name: H
          - name: Smstateen
