# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: NMI_MCAUSE_VALUES
long_name: |
  mcause values written on a non-maskable interrupt
definedBy:
  extension:
    name: Sm
description: |
  The values written to `mcause` when a base (unresumable) non-maskable
  interrupt is taken. These values are implementation-defined. The Interrupt
  bit of `mcause` should be set to indicate that this was an interrupt, and
  an Exception Code of 0 is reserved to mean "unknown cause"; implementations
  that do not distinguish sources of NMIs via `mcause` should return 0 in the
  Exception Code. Each value is an MXLEN-bit `mcause` value.

schema:
  type: array
  items:
    $ref: schema_defs.json#/$defs/uint64
  minItems: 0
  uniqueItems: true
