# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: HSTATEEN_JVT_TYPE
description: |
  Behavior of the hstateen0.JVT bit:

    * 'rw': read-write
    * 'read-only-0': read-only, fixed to 0
    * 'read-only-1': read-only, fixed to 1
long_name: TODO
schema:
  type: string
  enum:
    - rw
    - read-only-0
    - read-only-1
requirements:
  allOf:
    # hstateen0.JVT is read-only zero when mstateen0.JVT is read-only zero
    - if:
        allOf:
          - extension:
              name: Smstateen
          - param:
              name: MSTATEEN_JVT_TYPE
              equal: read-only-0
      then:
        param:
          name: HSTATEEN_JVT_TYPE
          equal: read-only-0
    # hstateen0.JVT cannot be read-only one unless mstateen0.JVT is read-only one
    - if:
        allOf:
          - extension:
              name: Smstateen
          - param:
              name: HSTATEEN_JVT_TYPE
              equal: read-only-1
      then:
        param:
          name: MSTATEEN_JVT_TYPE
          equal: read-only-1
definedBy:
  allOf:
    - extension:
        name: Zcmt
    - extension:
        name: H
    - extension:
        anyOf:
          - name: Smstateen
          - name: Ssstateen
