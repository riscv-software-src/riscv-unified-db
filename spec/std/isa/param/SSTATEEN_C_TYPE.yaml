# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SSTATEEN_C_TYPE
description: |
  Behavior of the `sstateen0.C` bit:

    * 'rw': read-write
    * 'read-only-0': read-only, fixed to 0
    * 'read-only-1': read-only, fixed to 1
long_name: Behavior of sstateen0.C
schema:
  type: string
  enum:
    - rw
    - read-only-0
    - read-only-1
requirements:
  allOf:
    # A read-only zero bit in mstateen0 appears as read-only zero in sstateen0
    - if:
        param:
          name: MSTATEEN_C_TYPE
          equal: read-only-0
      then:
        param:
          name: SSTATEEN_C_TYPE
          equal: read-only-0
    # A bit in sstateen0 cannot be read-only one unless it is read-only one in mstateen0
    - if:
        param:
          name: SSTATEEN_C_TYPE
          equal: read-only-1
      then:
        param:
          name: MSTATEEN_C_TYPE
          equal: read-only-1
    # ...and, if hstateen0 exists, in hstateen0
    - if:
        allOf:
          - extension:
              name: H
          - param:
              name: SSTATEEN_C_TYPE
              equal: read-only-1
      then:
        param:
          name: HSTATEEN_C_TYPE
          equal: read-only-1
definedBy:
  extension:
    allOf:
      - name: Smstateen
      - name: Ssstateen
