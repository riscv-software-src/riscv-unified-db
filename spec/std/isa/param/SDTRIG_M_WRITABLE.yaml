# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_M_WRITABLE
description: |
  If true, the M bit in every trigger type that has one (mcontrol, mcontrol6, icount, itrigger, etrigger) can be set to 1, so triggers can match in M-mode.
  If false, the M bit is read-only 0. Since the M bit resets to 0, 0 is always supported.
long_name: Trigger M bit is writable
schema:
  type: boolean
definedBy:
  extension:
    name: Sdtrig
