name: MSTATEEN1_SE0_TYPE
long_name: Behavior of mstateen1.SE0 (bit 63)
description: |
  Behavior of the `mstateen1.SE0` bit (bit 63), which controls access to
  `hstateen1`, `hstateen1h`, and `sstateen1`:

    * 'rw': read-write
    * 'read-only-0': read-only, fixed to 0
    * 'read-only-1': read-only, fixed to 1

