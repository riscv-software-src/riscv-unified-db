# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_MCONTROL6_EXECUTE_WRITABLE
description: |
  If true, mcontrol6.EXECUTE can be set to 1, so mcontrol6 triggers can match on instruction execution.
  If false, mcontrol6.EXECUTE is read-only 0. Since mcontrol6.EXECUTE resets to 0, 0 is always supported.
long_name: mcontrol6.EXECUTE is writable
schema:
  type: boolean
definedBy:
  allOf:
    - extension:
        name: Sdtrig
    - param:
        name: SDTRIG_MCONTROL6_SUPPORTED_TRIGGERS
        includes: true
        reason: Only relevant if at least one trigger supports mcontrol6.
