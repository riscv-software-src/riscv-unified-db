kind: parameter
name: MSTATEEN0_SRMCFG_TYPE
description: |
  Behavior of the `mstateen0.SRMCFG` bit, which controls access to `srmcfg`:

    * 'rw': read-write
    * 'read-only-0': read-only, fixed to 0
    * 'read-only-1': read-only, fixed to 1
long_name: Behavior of mstateen0.SRMCFG
schema:
  type: string
  enum:
    - rw
    - read-only-0
    - read-only-1
definedBy:
  extension:
    allOf:
      - name: Ssqosid
      - name: Smstateen
