# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: STI_INTR_IMPL
description: |
  Whether or not supervisor-level timer interrupts are implemented.
  If Sstc is implemented, then STI_INTR_IMPL must be true.

  Possible values:

  true::
    Supervisor-level timer interrupts are implemented.
    `mie.STIE` and `mideleg.STI` are writable.

  false::
    Supervisor-level timer interrupts are not implemented.
    `mie.STIE`, `mip.STIP`, and `mideleg.STI` are read-only zero.
long_name: Supervisor-level timer interrupts are implemented
schema:
  type: boolean
requirements:
  idl(): |
    implemented?(ExtensionName::Sstc) -> STI_INTR_IMPL;
  reason: "When the Sstc extension is implemented, STIP reflects the timer interrupt signal resulting from `stimecmp`."
definedBy:
  extension:
    allOf:
      - name: Zicsr
      - name: S
