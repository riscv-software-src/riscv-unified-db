# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_TEXTRA_SSELECT_ASID_MATCH
description: |
  If true, textra.sselect value 2 is supported, matching on the ASID in satp or vsatp.
  Unsupported sselect values are legalized to 0 (ignore).
long_name: textra.sselect supports ASID matching
schema:
  type: boolean
definedBy:
  allOf:
    - extension:
        name: Sdtrig
    - extension:
        name: S
    - param:
        name: TDATA3_IMPLEMENTED
        equal: true
