# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_NUM_TRIGGERS
description: |
  The number of triggers implemented. Triggers are indexed by tselect from 0 to SDTRIG_NUM_TRIGGERS - 1.
long_name: TODO
schema:
  type: integer
  minimum: 1
  maximum: 18446744073709551616 # 2**64, max tselect values (2**XLEN)
definedBy:
  extension:
    name: Sdtrig

requirements:
  idl(): |
    MXLEN == 32 -> SDTRIG_NUM_TRIGGERS <= 33'h100000000;
