# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_VS_WRITABLE
description: |
  If true, the VS bit in every trigger type that has one (mcontrol, mcontrol6, icount, itrigger, etrigger) can be set to 1, so triggers can match in VS-mode.
  If false, the VS bit is read-only 0. Since the VS bit resets to 0, 0 is always supported.
long_name: Trigger VS bit is writable
schema:
  type: boolean
definedBy:
  extension:
    allOf:
      - name: Sdtrig
      - name: H
