# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: MCONTEXT_IMPLEMENTED
description: |
  Specifies if the mcontext CSR is implemented
long_name: mcontext CSR is implemented
schema:
  type: boolean
definedBy:
  allOf:
    - extension:
        name: Sdtrig
    - extension:
        name: H
requirements:
  if:
    param:
      name: HCONTEXT_AVAILABLE
      equal: true
  then:
    param:
      name: MCONTEXT_AVAILABLE
      equal: true
      reason: HCONTEXT cannot exist without MCONTEXT
