# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_MCONTROL6_MASKMAX6
description: In implementations that support match mode 1 (NAPOT), not all NAPOT ranges may be supported. All NAPOT ranges between 2^1 and 2^SDTRIG_MCONTROL6_MASKMAX6 are supported.
long_name: NAPOT ranges supported by match control type 6
schema:
  type: integer
  minimum: 1
  maximum: 64
definedBy:
  allOf:
    - extension:
        name: Sdtrig
    - param:
        name: SDTRIG_MCONTROL6_SUPPORTED_TRIGGERS
        includes: true
        reason: Only relevant if at least one trigger supports mcontrol6.

requirements:
  idl(): |
    MXLEN == 32 -> SDTRIG_MCONTROL6_MASKMAX6 <= 32;
