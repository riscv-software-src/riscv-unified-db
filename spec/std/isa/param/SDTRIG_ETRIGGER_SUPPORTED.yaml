# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_ETRIGGER_SUPPORTED
description: |
  Indicates which triggers support etrigger.
long_name: List for which exceptions are supported by etrigger
schema:
  type: array
  items:
    type: boolean
  maxItems: 18446744073709551616 # 2**64, max tselect values (2**XLEN)
  minItems: 0
definedBy:
  extension:
    name: Sdtrig

requirements:
  idl(): |
    $array_size(SDTRIG_ETRIGGER_SUPPORTED) == SDTRIG_NUM_TRIGGERS;
