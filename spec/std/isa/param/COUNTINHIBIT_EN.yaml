# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: COUNTINHIBIT_EN
description: |
  Indicates which hardware performance monitor counters can be disabled from `mcountinhibit`.

  `COUNTINHIBIT_EN[n]` controls whether `mcountinhibit.HPM<n>` is writable. It does
  not depend on whether `hpmcounter<n>`/`mhpmcounter<n>` is read-only zero.

  COUNTINHIBIT_EN[1] can never be true, since it corresponds to `mcountinhibit.TM`,
  which is always read-only-0.
long_name: TODO
schema:
  type: array
  items:
    - type: boolean
    - const: false
    - type: boolean
  additionalItems:
    type: boolean
  maxItems: 32
  minItems: 32

definedBy:
  allOf:
    - extension:
        name: Sm
    - param:
        name: MCOUNTINHIBIT_IMPLEMENTED
        equal: true
        reason: |
          `COUNTINHIBIT_EN` only has effect when the `mcountinhibit` CSR is implemented.
