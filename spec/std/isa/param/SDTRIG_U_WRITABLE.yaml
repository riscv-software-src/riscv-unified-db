# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_U_WRITABLE
description: |
  If true, the U bit in every trigger type that has one (mcontrol, mcontrol6, icount, itrigger, etrigger) can be set to 1, so triggers can match in U-mode.
  If false, the U bit is read-only 0. Since the U bit resets to 0, 0 is always supported.
long_name: Trigger U bit is writable
schema:
  type: boolean
definedBy:
  extension:
    allOf:
      - name: Sdtrig
      - name: U
