# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: HCONTEXT_AVAILABLE
description: |
  Specifies if HCONTEXT is available
long_name: HCONTEXT Availability
schema:
  type: boolean
definedBy:
  extension:
    name: Sdtrig
requirements:
  if:
    param:
      name: HCONTEXT_AVAILABLE
      equal: true
  then:
    allOf:
      - extension:
          name: H
      - param:
          name: MCONTEXT_AVAILABLE
          equal: true
          reason: HCONTEXT cannot exist without MCONTEXT
