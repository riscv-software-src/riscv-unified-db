# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_TEXTRA_MHSELECT_VMID_MATCH
description: |
  If true, textra.mhselect values 2 and 6 are supported, matching on the VMID in hgatp.
  Unsupported mhselect values are legalized to 0 (ignore).
long_name: textra.mhselect supports VMID matching
schema:
  type: boolean
definedBy:
  allOf:
    - extension:
        name: Sdtrig
    - extension:
        name: H
    - param:
        name: TDATA3_IMPLEMENTED
        equal: true
