# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: VSEI_INTR_IMPL
description: |
  Whether or not virtual supervisor-level external interrupts are implemented.

  Possible values:

  true::
    Virtual supervisor-level external interrupts are implemented.
    `mie.VSEIE` and `mideleg.VSEI` are writable.

  false::
    Virtual supervisor-level external interrupts are not implemented.
    `mie.VSEIE`, `mip.VSEIP`, and `mideleg.VSEI` are read-only zero.
long_name: Virtual supervisor-level external interrupts are implemented
schema:
  type: boolean
definedBy:
  extension:
    allOf:
      - name: Zicsr
      - name: H
