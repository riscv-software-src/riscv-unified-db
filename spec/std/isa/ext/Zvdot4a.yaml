$schema: "ext_schema.json#"
kind: extension
name: Zvdot4a8i
long_name: Vector Dot-Product (4-element, 8-bit integer)
description: |
  Convolution operations have seen considerable speedup on other microprocessor
  architectures with the adoption of specialized dot-product instructions. Such
  convolutions are used in many AI/ML, image-processing, and DSP algorithms.
  These algorithms can be found in benchmark suites used to measure the
  relative performance of microprocessor cores against each other.

  The dot product operation is defined for four INT8 values held in a 32-bit
  element group, with an accumulation back into a single 32-bit value via
  quad-widening. The dot-product operation takes the 8-bit values at the same
  index from each source and multiplies them together. The four products are
  summed together and accumulated into the 32-bit element of the destination
  register. If the instruction variant has any signed source data, the
  accumulation is performed into a signed value.

  Given that the source data is 8-bit and accumulation is performed into
  32-bit, it is presumed that overflow is infrequent, so no saturation option
  has been provided.

  This extension was previously known as Zvqdotq; it was renamed to Zvdot4a
  (with the instruction mnemonics renamed from vqdot* to vdot4a*) following
  ARC feedback.
type: unprivileged
versions:
  - version: "0.1.0"
    state: development
    contributors:
      - name: Nicolas Brunie
      - name: Kenneth Dockser
    url: https://github.com/riscv/riscv-isa-manual/pull/2576
requirements:
  extension:
    name: Zve32x
