# yaml-language-server: $schema=../../../schemas/ext_schema.json

$schema: "ext_schema.json#"
kind: extension
name: I
type: unprivileged
long_name: Base integer ISA (RV32I or RV64I)
versions:
  - version: "2.1.0"
    state: ratified
    ratification_date: 2019-06
    changes:
      - ratified RVWMO memory model and exclusion of FENCE.I, counters, and CSR instructions that were in previous base ISA
description: |
  The I extension defines the base integer instruction set for RV32I and RV64I.
  It provides the integer register state, integer computation, loads and stores,
  control transfer, and system instructions needed to support compilers, assemblers,
  linkers, and operating systems.
