# yaml-language-server: $schema=../../../schemas/ext_schema.json

$schema: "ext_schema.json#"
kind: extension
name: Zvabd
long_name: Vector Integer Absolute Difference
description: |
  The Zvabd extension defines element-wise absolute difference instructions for
  vectors of integers, including widening absolute-difference-and-accumulate
  variants. These operations are widely used in image registration, object
  recognition, motion estimation, and loop filters for video workloads.

  The single-width instructions support SEW = 8, 16, and 32, and also support
  SEW = 64 when Zve64x is implemented. The widening accumulate instructions
  support SEW = 8 and 16.
type: unprivileged
versions:
  - version: "0.9.0"
    state: frozen
requirements:
  extension:
    name: Zve32x
