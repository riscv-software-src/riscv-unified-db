# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: lxsbu
long_name: Load scaled indexed byte unsigned
description: |
  Load 8 bits of data into register `xd` from the effective address
  `X[xs2] + X[xs1]`, where `xs2` is the base and `xs1` is the index.
  Zero extend the result to XLEN.

  The `lxbu` mnemonic is an assembler pseudoinstruction for `lxsbu`.
definedBy:
  extension:
    name: Zilx
assembly: xd, (xs2), xs1
encoding:
  match: 1101000----------100-----0101111
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
pseudoinstructions:
  - when: "true"
    to: lxbu xd, (xs2), xs1
operation(): |
  XReg virtual_address = X[xs2] + X[xs1];

  X[xd] = read_memory(8, virtual_address, $encoding);
