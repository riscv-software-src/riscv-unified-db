# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fclass.h
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    oneOf:
      - name: Zfh
      - name: Zhinx
assembly: xd, fs1
encoding:
  match: 111001000000-----001-----1010011
  variables:
    - name: fs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  Bits<16> value = f16_operand(F[fs1]);
  if (is_hp_neg_inf?(value)) {
    X[xd] = 1 `<< 0;
  } else if (is_hp_neg_norm?(value)) {
    X[xd] = 1 `<< 1;
  } else if (is_hp_neg_subnorm?(value)) {
    X[xd] = 1 `<< 2;
  } else if (is_hp_neg_zero?(value)) {
    X[xd] = 1 `<< 3;
  } else if (is_hp_pos_zero?(value)) {
    X[xd] = 1 `<< 4;
  } else if (is_hp_pos_subnorm?(value)) {
    X[xd] = 1 `<< 5;
  } else if (is_hp_pos_norm?(value)) {
    X[xd] = 1 `<< 6;
  } else if (is_hp_pos_inf?(value)) {
    X[xd] = 1 `<< 7;
  } else if (is_hp_signaling_nan?(value)) {
    X[xd] = 1 `<< 8;
  } else {
    X[xd] = 1 `<< 9;
  }
