# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fnmsub.h
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    oneOf:
      - name: Zfh
      - name: Zhinx
assembly: fd, fs1, fs2, fs3, rm
encoding:
  match: "-----10------------------1001011"
  variables:
    - name: fs3
      location: 31-27
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  RoundingMode mode = rm_to_mode(rm, $encoding);
  F[fd] = f16_result(f16_muladd(f16_operand(F[fs1]), f16_operand(F[fs2]), f16_operand(F[fs3]), F32MulAddOp::Softfloat_mulAdd_subProd, mode));
  mark_f_state_dirty();
