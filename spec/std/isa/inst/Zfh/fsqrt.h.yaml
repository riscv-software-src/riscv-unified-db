# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsqrt.h
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    oneOf:
      - name: Zfh
      - name: Zhinx
assembly: fd, fs1, rm
encoding:
  match: 010111000000-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  RoundingMode mode = rm_to_mode(rm, $encoding);
  F[fd] = f16_result(f16_sqrt(f16_operand(F[fs1]), mode));
  mark_f_state_dirty();
