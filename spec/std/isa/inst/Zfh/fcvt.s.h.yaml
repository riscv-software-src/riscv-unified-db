# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: fcvt.s.h
long_name: Convert single-precision float to a half-precision float
definedBy:
  extension:
    oneOf:
      - name: Zfhmin
      - name: Zhinxmin
assembly: fd, fs1, rm
description: |
  Converts a single-precision number in floating-point register _fs1_ into a half-precision floating-point number in
  floating-point register _fd_.

  `fcvt.s.h` will never round, and so the 'rm' field is effectively ignored.

encoding:
  match: 010000000010-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  check_f_ok($encoding);
  F[fd] = f32_result(f16_to_f32(f16_operand(F[fs1])));
  mark_f_state_dirty();
