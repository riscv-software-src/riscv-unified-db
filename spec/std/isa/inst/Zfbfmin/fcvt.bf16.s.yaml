# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: fcvt.bf16.s
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zfbfmin
assembly: fd, fs1, rm
encoding:
  match: 010001001000-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  RoundingMode rounding_mode = rm_to_mode(rm, $encoding);
  F[fd] = f16_result(f32_to_bf16(f32_operand(F[fs1]), rounding_mode));
  mark_f_state_dirty();
