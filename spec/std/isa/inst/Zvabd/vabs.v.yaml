# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vabs.v
long_name: Vector Single-Width Signed Integer Absolute
description: |
  An absolute value operation is performed on each element of vs2, storing the
  result in vector register vd according to mask vm.

  vabs.v supports SEW of 8, 16, and 32 when Zve32x is implemented.
  When Zve64x is implemented, vabs.v also supports SEW of 64.
definedBy:
  extension:
    name: Zvabd
assembly: vd, vs2, vm
encoding:
  match: 010010------10000010-----1010111
  variables:
    - name: vm
      location: 25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  VectorState state = vector_state();
  VectorLmulType lmul_type = state.lmul_type;

  XReg vlen = VLEN;
  XReg vlmax;
  if (lmul_type == VectorLmulType::Multiply) {
    vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
  }

  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 start_bit_pos = i * state.sew;
    U32 end_bit_pos = start_bit_pos + state.sew - 1;
    if (vm == 1'b1 || V[0][i:i] == 1'b1) {
      # active element
      if (V[vs2][end_bit_pos:end_bit_pos] == 1'b1) {
        V[vd][end_bit_pos:start_bit_pos] = -$signed(V[vs2][end_bit_pos:start_bit_pos]);
      } else {
        V[vd][end_bit_pos:start_bit_pos] = V[vs2][end_bit_pos:start_bit_pos];
      }
    }
    # inactive element: handled according to vtype.VMA policy
  }
  # tail elements (i >= vl): handled according to vtype.VTA policy

  CSR[vstart].VALUE = 0;
