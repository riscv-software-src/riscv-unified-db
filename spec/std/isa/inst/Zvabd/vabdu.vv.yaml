# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vabdu.vv
long_name: Vector Single-Width Unsigned Integer Absolute Difference
description: |
  Computes the element-wise absolute difference of two unsigned integer SEW-bit
  source operands vs1 and vs2 and writes the result to vd according to mask vm.

  Reserved when SEW is neither 8 nor 16.
definedBy:
  extension:
    name: Zvabd
assembly: vd, vs2, vs1, vm
encoding:
  match: 010011-----------010-----1010111
  variables:
    - name: vm
      location: 25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  VectorState state = vector_state();

  if (state.sew != 8 && state.sew != 16) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  VectorLmulType lmul_type = state.lmul_type;

  XReg vlen = VLEN;
  XReg vlmax;
  if (lmul_type == VectorLmulType::Multiply) {
    vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
  }

  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 start_bit_pos = i * state.sew;
    U32 end_bit_pos = start_bit_pos + state.sew - 1;
    if (vm == 1'b1 || V[0][i:i] == 1'b1) {
      # active element
      if (V[vs2][end_bit_pos:start_bit_pos] >= V[vs1][end_bit_pos:start_bit_pos]) {
        V[vd][end_bit_pos:start_bit_pos] = V[vs2][end_bit_pos:start_bit_pos] - V[vs1][end_bit_pos:start_bit_pos];
      } else {
        V[vd][end_bit_pos:start_bit_pos] = V[vs1][end_bit_pos:start_bit_pos] - V[vs2][end_bit_pos:start_bit_pos];
      }
    }
    # inactive element: handled according to vtype.VMA policy
  }
  # tail elements (i >= vl): handled according to vtype.VTA policy

  CSR[vstart].VALUE = 0;
