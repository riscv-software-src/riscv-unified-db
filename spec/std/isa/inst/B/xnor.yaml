# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: xnor
long_name: Exclusive NOR
description: |
  Performs the bit-wise exclusive-NOR operation on xs1 and xs2.
definedBy:
  extension:
    anyOf:
      - name: Zbb
      - name: Zbkb
assembly: xd, xs1, xs2
encoding:
  match: 0100000----------100-----0110011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  X[xd] = ~(X[xs1] ^ X[xs2]);
