# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: fsgnjx.s
long_name: Floating-Point Sign-Inject XOR Single-Precision
description: |
  The `fsgnjx.s` instruction produces a result that takes all bits except the sign bit from `fs1`.
  The result's sign bit is the XOR of sign bits of `fs1` and `fs2`, and the result is written to
  the destination register `fd`. Sign-injection instructions do not set floating-point exception
  flags, nor do they canonicalize NaNs.
definedBy:
  extension:
    name: F
assembly: fd, fs1, fs2
encoding:
  match: 0010000----------010-----1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
pseudoinstructions:
  - when: (fs2 == fs1)
    to: fabs.s fd, fs1
operation(): |
  check_f_ok($encoding);

  Bits<32> sp_value = {F[fs1][31] ^ F[fs2][31], F[fs1][30:0]};

  if (implemented?(ExtensionName::D)) {
    F[fd] = nan_box(32, 64, sp_value);
  } else {
    F[fd] = sp_value;
  }

  mark_f_state_dirty();
