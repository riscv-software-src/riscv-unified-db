# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: add.uw
long_name: Add unsigned word
description: |
  Performs an XLEN-wide addition between xs2 and the
  zero-extended least-significant word of xs1.
definedBy:
  allOf:
    - xlen: 64
    - extension:
        name: Zba
assembly: xd, xs1, xs2
encoding:
  match: 0000100----------000-----0111011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
pseudoinstructions:
  - when: xs2 == 0
    to: zext.w xd, xs1
operation(): |
  X[xd] = X[xs2] + X[xs1][31:0];
