# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vdot4au.vx
long_name: Vector 4-element unsigned-unsigned dot-product accumulate (vector-scalar)
description: |
  Computes the dot product of four unsigned 8-bit elements from `vs2` and four
  unsigned 8-bit elements packed/replicated from the scalar `rs1`, sums the
  four products, and accumulates the unsigned 32-bit result into the
  corresponding 32-bit element of `vd`.
definedBy:
  extension:
    name: Zvdot4a8i
assembly: vd, vs2, rs1, vm
encoding:
  match: 101000-----------110-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
