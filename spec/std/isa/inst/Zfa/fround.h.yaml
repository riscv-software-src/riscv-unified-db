# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fround.h
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    allOf:
      - name: Zfa
      - name: Zfh
assembly: fd, fs1, rm
encoding:
  match: 010001000100-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  RoundingMode rounding_mode = rm_to_mode(rm, $encoding);
  Bits<16> input = f16_operand(F[fs1]);
  Bits<32> result = round_f32_to_integral(f16_to_f32(input), rounding_mode);
  F[fd] = f16_result(f32_to_f16(result, rounding_mode));
  mark_f_state_dirty();
