# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fminm.h
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    allOf:
      - name: Zfa
      - name: Zfh
assembly: fd, fs1, fs2
encoding:
  match: 0010110----------010-----1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  Bits<16> a = f16_operand(F[fs1]);
  Bits<16> b = f16_operand(F[fs2]);
  if (is_hp_nan?(a) || is_hp_nan?(b)) {
    if (is_hp_signaling_nan?(a) || is_hp_signaling_nan?(b)) {
      set_fp_flag(FpFlag::NV);
    }
    F[fd] = f16_result(HP_CANONICAL_NAN);
  } else {
    # Treat -0 as less than +0 so minimumNumber selects -0.
    Boolean a_lt_b = ((a[14:0] | b[14:0]) == 0) ? (a[15] == 1) : hp_less_than?(a, b);
    F[fd] = f16_result(a_lt_b ? a : b);
  }
  mark_f_state_dirty();
