# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: c.zext.w
long_name: Zero-extend word, 16-bit encoding
description: |
  Takes a single source/destination operand.
  It zero-extends the least-significant word of the operand to XLEN bits by inserting zeros into all of the bits more significant than 31.

definedBy:
  allOf:
    - xlen: 64
    - extension:
        allOf:
          - name: Zcb
          - name: Zba
assembly: xd
encoding:
  match: 100111---1110001
  variables:
    - name: xd
      location: 9-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |2

  if (implemented?(ExtensionName::C) && MISA_CSR_IMPLEMENTED && (CSR[misa].C == 1'b0)) {
    reserved_instruction($encoding);
  }

  X[creg2reg(xd)] = X[creg2reg(xd)][31:0];
