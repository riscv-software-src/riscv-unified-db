$schema: inst_schema.json#
kind: instruction
name: dret
long_name: Return from Debug Mode
description: |
  Resumes execution after Debug Mode. `dret` is only legal in Debug Mode;
  executing it in any other mode raises an Illegal Instruction exception.

  When executed in Debug Mode, `dret`:

  . Sets the PC to the value in `dpc`.
  . Changes the privilege and virtualization mode to those held in
    `dcsr.PRV` and `dcsr.V`.
  . If the new privilege mode is less privileged than M-mode, clears
    `mstatus.MPRV`.
  . If Smdbltrp is implemented and the new privilege mode is less privileged
    than M-mode, clears `mstatus.MDT`.
  . If Ssdbltrp is implemented and the new privilege mode is U, VS, or VU,
    clears `sstatus.SDT`; if the new mode is VU, also clears `vsstatus.SDT`.
  . If Zicfilp is implemented, sets `ELP` to `dcsr.PELP` if Zicfilp is
    enabled (`xLPE`=1) in the new privilege mode, otherwise to
    `NO_LP_EXPECTED`, and then clears `dcsr.PELP`.
  . Leaves Debug Mode.
definedBy:
  extension:
    name: Sdext
assembly: ""
encoding:
  match: "01111011001000000000000001110011"
  variables: []
access:
  s: never
  u: never
  vs: never
  vu: never
data_independent_timing: false
operation(): |
  # UDB does not yet model Debug Mode state, so the hart can never be in Debug
  # Mode and dret is always illegal, regardless of privilege mode.
  raise (ExceptionCode::IllegalInstruction, mode(), $encoding);

