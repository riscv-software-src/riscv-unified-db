# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: viota.m
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vm
encoding:
  match: 010100------10000010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  # vstart != 0 is reserved for this instruction per the V spec
  if (CSR[vstart].VALUE != 0) {
    unpredictable("viota.m with vstart != 0 is reserved");
  }

  VectorState state = vector_state();

  # Write to vd[i] the exclusive prefix sum of vs2 mask bits at indices < i
  # Only active elements (per mask) contribute to the sum AND are written
  U32 elems_per_reg = VLEN >> state.log2_sew;
  XReg sum = 0;
  for (U32 i = 0; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;
      # Write BEFORE adding (exclusive prefix)
      V[vd + reg_off][end_bit:start_bit] = sum;
      if (V[vs2][i] == 1'b1) {
        sum = sum + 1;
      }
    }
  }

  CSR[vstart].VALUE = 0;
