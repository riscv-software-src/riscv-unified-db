# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vwredsum.vs
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 110001-----------000-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();

  U32 dst_sew = state.sew << 1;
  U32 src_elems_per_reg = VLEN >> state.log2_sew;

  Bits<128> acc = V[vs1][dst_sew-1:0];

  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 src_reg_off = i / src_elems_per_reg;
      U32 src_start = (i % src_elems_per_reg) * state.sew;
      U32 src_end = src_start + state.sew - 1;
      acc = acc + $signed(V[vs2 + src_reg_off][src_end:src_start]);
    }
  }

  if (CSR[vl].VALUE > 0) {
    V[vd][dst_sew-1:0] = acc[dst_sew-1:0];
  }

  CSR[vstart].VALUE = 0;
