# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfwmacc.vv
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    anyOf:
      - name: Zvl32b
      - name: Zvfbfa
assembly: vd, vs1, vs2, vm
encoding:
  match: 111100-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  VectorState state = vector_state();
  RoundingMode mode = rm_to_mode(3'b111, $encoding);
  U32 src_elems_per_reg = VLEN >> state.log2_sew;
  U32 dst_elems_per_reg = VLEN >> (state.log2_sew + 1);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 src_reg_off = i / src_elems_per_reg;
      U32 src_start = (i % src_elems_per_reg) * state.sew;
      U32 src_end = src_start + state.sew - 1;
      U32 dst_reg_off = i / dst_elems_per_reg;
      U32 dst_start = (i % dst_elems_per_reg) * (state.sew << 1);
      U32 dst_end = dst_start + (state.sew << 1) - 1;
      if (state.sew == 32) {
        Bits<64> vs2_f64 = f32_to_f64(V[vs2 + src_reg_off][src_end:src_start]);
        Bits<64> vs1_f64 = f32_to_f64(V[vs1 + src_reg_off][src_end:src_start]);
        Bits<64> vd_f64 = V[vd + dst_reg_off][dst_end:dst_start];
        V[vd + dst_reg_off][dst_end:dst_start] = f64_muladd(vs2_f64, vs1_f64, vd_f64, F32MulAddOp::Softfloat_mulAdd_addC, mode);
      }
    }
  }
  mark_f_state_dirty();
  CSR[vstart].VALUE = 0;
