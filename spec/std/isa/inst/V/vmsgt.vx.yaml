# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmsgt.vx
long_name: Vector mask greater than signed scalar
description: |
  Sets mask bits where elements in vs2 are greater than scalar in rs1 (signed), according to mask vm, and stores results in vd. Element width is determined by SEW setting. Supports vector masking and follows vector tail policy.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 011111-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  XReg sext_xs1 = $signed(X[xs1]);

  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit = start_bit + state.sew - 1;
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      V[vd][i] = ($signed(V[vs2 + reg_off][end_bit:start_bit]) > $signed(sext_xs1[state.sew-1:0])) ? 1'b1 : 1'b0;
    }
  }

  CSR[vstart].VALUE = 0;
