# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsbc.vvm
long_name: "Vector integer subtract-with-borrow-in vector"
description: |
  Subtract from each element of vector register vs2 the respective element from vector register vs1 and the respective borrow-in from vector register v0, and write the result to vector register vd. `vd[i] = vs2[i] - vs1[i] - v0.mask[i]`
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, v0
encoding:
  match: 0100100----------000-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
