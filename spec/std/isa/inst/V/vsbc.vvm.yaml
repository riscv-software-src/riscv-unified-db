# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsbc.vvm
long_name: "Vector subtract with borrow and masked"
description: |
  Performs subtraction on elements from vector registers vs2 and vs1, subtracts the borrow-in from vector register vs3, and stores results in vector register vd, using vector mask vm.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, v0
encoding:
  match: 0100100----------000-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();

  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit = start_bit + state.sew - 1;
    Bits<1> borrow_in = V[0][i];
    V[vd + reg_off][end_bit:start_bit] = V[vs2 + reg_off][end_bit:start_bit] - V[vs1 + reg_off][end_bit:start_bit] - borrow_in;
  }

  CSR[vstart].VALUE = 0;
