# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vslidedown.vi
long_name: "Vector slide down with immediate"
description: |
  Slides elements in vector register vs2 down by 1 position, inserting immediate value at the top, and stores results in vector register vd, using vector mask vm.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, imm, vm
encoding:
  match: 001111-----------011-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  VectorLmulType lmul_type = state.lmul_type;

  XReg vlen = VLEN;
  XReg vlmax;
  if (lmul_type == VectorLmulType::Multiply) {
    vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
  }

  XReg offset = imm;
  U32 elems_per_reg = VLEN >> state.log2_sew;

  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 dst_reg_off = i / elems_per_reg;
      U32 dst_start = (i % elems_per_reg) * state.sew;
      U32 dst_end = dst_start + state.sew - 1;
      XReg src_idx = i + offset;
      if (src_idx < vlmax) {
        U32 src_reg_off = src_idx / elems_per_reg;
        U32 src_start = (src_idx % elems_per_reg) * state.sew;
        U32 src_end = src_start + state.sew - 1;
        V[vd + dst_reg_off][dst_end:dst_start] = V[vs2 + src_reg_off][src_end:src_start];
      } else {
        V[vd + dst_reg_off][dst_end:dst_start] = 0;
      }
    }
  }

  CSR[vstart].VALUE = 0;
