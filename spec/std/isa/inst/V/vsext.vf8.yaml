# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsext.vf8
long_name: "Vector sign-extend by factor of 8"
description: |
  Sign-extends elements from vector register vs2 by a factor of 8 and stores results in vector register vd, using vector mask vm. The operation extends SEW to 8×SEW.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vm
encoding:
  match: 010010------00011010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  if (CSR[vstart].VALUE != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  VectorState state = vector_state();

  U32 src_sew = state.sew >> 3;
  U32 dst_elems_per_reg = VLEN >> state.log2_sew;
  U32 src_elems_per_reg = dst_elems_per_reg << 3;

  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 src_reg_off = i / src_elems_per_reg;
      U32 src_start = (i % src_elems_per_reg) * src_sew;
      U32 src_end = src_start + src_sew - 1;
      U32 dst_reg_off = i / dst_elems_per_reg;
      U32 dst_start = (i % dst_elems_per_reg) * state.sew;
      U32 dst_end = dst_start + state.sew - 1;
      V[vd + dst_reg_off][dst_end:dst_start] = $signed(V[vs2 + src_reg_off][src_end:src_start]);
    }
  }

  CSR[vstart].VALUE = 0;
