# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vrgather.vx
long_name: "Vector register gather with scalar index"
description: |
  Gathers elements from vector register vs2 using scalar index from register xs1 and stores results in vector register vd, using vector mask vm. This operation performs indexed element selection.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 001100-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  VectorLmulType lmul_type = state.lmul_type;

  XReg vlen = VLEN;
  XReg vlmax;
  if (lmul_type == VectorLmulType::Multiply) {
    vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
  }

  U32 elems_per_reg = VLEN >> state.log2_sew;
  XReg idx = X[xs1];
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;
      if (idx < vlmax) {
        U32 src_reg_off = idx / elems_per_reg;
        U32 src_start = (idx % elems_per_reg) * state.sew;
        U32 src_end = src_start + state.sew - 1;
        V[vd + reg_off][end_bit:start_bit] = V[vs2 + src_reg_off][src_end:src_start];
      } else {
        V[vd + reg_off][end_bit:start_bit] = 0;
      }
    }
  }

  CSR[vstart].VALUE = 0;
