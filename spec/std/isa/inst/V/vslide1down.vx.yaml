# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vslide1down.vx
long_name: "Vector slide down by 1 element with scalar"
description: |
  Slides elements in vector register vs2 down by 1 position, inserting scalar register xs1 at the top, and stores results in vector register vd, using vector mask vm.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 001111-----------110-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();

  U32 elems_per_reg = VLEN >> state.log2_sew;

  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 dst_reg_off = i / elems_per_reg;
      U32 dst_start = (i % elems_per_reg) * state.sew;
      U32 dst_end = dst_start + state.sew - 1;
      if (i < CSR[vl].VALUE - 1) {
        U32 src_reg_off = (i + 1) / elems_per_reg;
        U32 src_start = ((i + 1) % elems_per_reg) * state.sew;
        U32 src_end = src_start + state.sew - 1;
        V[vd + dst_reg_off][dst_end:dst_start] = V[vs2 + src_reg_off][src_end:src_start];
      } else {
        V[vd + dst_reg_off][dst_end:dst_start] = X[xs1][state.sew-1:0];
      }
    }
  }

  CSR[vstart].VALUE = 0;
