# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfmul.vv
long_name: Vector floating-point multiply
description: |
  Performs floating-point multiplication on elements from vs2 and vs1, according to mask vm, and stores results in vd. Element width is determined by SEW setting. Follows IEEE-754 floating-point standards. Supports vector masking and follows vector tail policy.
definedBy:
  extension:
    anyOf:
      - name: Zvl32b
      - name: Zvfbfa
assembly: vd, vs2, vs1, vm
encoding:
  match: 100100-----------001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  VectorState state = vector_state();
  RoundingMode mode = rm_to_mode(3'b111, $encoding);
  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;
      if (state.sew == 32) {
        Bits<32> a = V[vs2 + reg_off][end_bit:start_bit];
        Bits<32> b = V[vs1 + reg_off][end_bit:start_bit];
        V[vd + reg_off][end_bit:start_bit] = f32_mul(a, b, mode);
      } else {
        Bits<64> a = V[vs2 + reg_off][end_bit:start_bit];
        Bits<64> b = V[vs1 + reg_off][end_bit:start_bit];
        V[vd + reg_off][end_bit:start_bit] = f64_mul(a, b, mode);
      }
    }
  }
  mark_f_state_dirty();
  CSR[vstart].VALUE = 0;
