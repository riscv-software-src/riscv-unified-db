# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmadc.vi
long_name: "Vector integer add-with-carry-out immediate"
description: |
  Add each element from vector register vs2 to the immediate value imm, and write the respective carry-out to mask register vd. There is no carry-in. `vd.mask[i] = carry_out(vs2[i] + imm)`
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, imm
encoding:
  match: 0100011----------011-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
      sign_extend: true
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
