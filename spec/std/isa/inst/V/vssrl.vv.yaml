# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vssrl.vv
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 101010-----------000-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  VectorLmulType lmul_type = state.lmul_type;

  XReg vlen = VLEN;
  XReg vlmax;
  if (lmul_type == VectorLmulType::Multiply) {
    vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
  }

  Bits<2> vxrm_mode = CSR[vcsr].VXRM;
  U32 elems_per_reg = VLEN >> state.log2_sew;
  XReg one = 1;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;

      XReg a = V[vs2 + reg_off][end_bit:start_bit];
      U32 shamt = V[vs1 + reg_off][end_bit:start_bit][state.log2_sew-1:0];

      XReg round_bit = 0;
      if (shamt > 0) {
        # Guard bit: bit (shamt-1) of a
        XReg guard = (a >> (shamt - 1)) & 1;
        # Sticky bits: bits below shamt-1, i.e., a & ((1 << (shamt-1)) - 1)
        XReg sticky = a & ((one << (shamt - 1)) - 1);
        # Result LSB: bit shamt of a
        XReg res_lsb = (a >> shamt) & 1;
        if (vxrm_mode == 2'b00) {
          round_bit = guard;
        } else if (vxrm_mode == 2'b01) {
          round_bit = guard & (sticky != 0 || res_lsb != 0 ? 1 : 0);
        } else if (vxrm_mode == 2'b10) {
          round_bit = 0;
        } else {
          round_bit = (1 - res_lsb) & (guard != 0 || sticky != 0 ? 1 : 0);
        }
      }

      XReg result = (a >> shamt) + round_bit;
      V[vd + reg_off][end_bit:start_bit] = result[state.sew-1:0];
    }
  }

  CSR[vstart].VALUE = 0;
