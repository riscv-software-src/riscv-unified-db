# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfirst.m
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: xd, vs2, vm
encoding:
  match: 010000------10001010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  # vstart != 0 is reserved for this instruction per the V spec
  if (CSR[vstart].VALUE != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  # Find the index of the first set bit in the mask register vs2 within [0, VL).
  # Per spec: with vm=0, only active elements (where V0[i]=1) are considered.
  # Returns -1 (all ones) if no active bits are set.
  XReg result = {xlen(){1'b1}};  # -1 (all ones) as initial value
  Boolean found = false;

  for (U32 i = 0; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      if (!found && V[vs2][i] == 1'b1) {
        result = i;
        found = true;
      }
    }
  }

  X[xd] = result;
  CSR[vstart].VALUE = 0;
