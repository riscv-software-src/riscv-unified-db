# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfclass.v
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    anyOf:
      - name: Zvl32b
      - name: Zvfbfa
assembly: vd, vs2, vm
encoding:
  match: 010011------10000001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;
      if (state.sew == 32) {
        Bits<32> elem = V[vs2 + reg_off][end_bit:start_bit];
        XReg result = 0;
        if (is_sp_neg_inf?(elem)) { result = 1 `<< 0; }
        else if (is_sp_neg_norm?(elem)) { result = 1 `<< 1; }
        else if (is_sp_neg_subnorm?(elem)) { result = 1 `<< 2; }
        else if (is_sp_neg_zero?(elem)) { result = 1 `<< 3; }
        else if (is_sp_pos_zero?(elem)) { result = 1 `<< 4; }
        else if (is_sp_pos_subnorm?(elem)) { result = 1 `<< 5; }
        else if (is_sp_pos_norm?(elem)) { result = 1 `<< 6; }
        else if (is_sp_pos_inf?(elem)) { result = 1 `<< 7; }
        else if (is_sp_signaling_nan?(elem)) { result = 1 `<< 8; }
        else { result = 1 `<< 9; }
        V[vd + reg_off][end_bit:start_bit] = result[state.sew - 1:0];
      } else {
        Bits<64> elem = V[vs2 + reg_off][end_bit:start_bit];
        XReg result = 0;
        if (is_dp_neg_inf?(elem)) { result = 1 `<< 0; }
        else if (is_dp_neg_norm?(elem)) { result = 1 `<< 1; }
        else if (is_dp_neg_subnorm?(elem)) { result = 1 `<< 2; }
        else if (is_dp_neg_zero?(elem)) { result = 1 `<< 3; }
        else if (is_dp_pos_zero?(elem)) { result = 1 `<< 4; }
        else if (is_dp_pos_subnorm?(elem)) { result = 1 `<< 5; }
        else if (is_dp_pos_norm?(elem)) { result = 1 `<< 6; }
        else if (is_dp_pos_inf?(elem)) { result = 1 `<< 7; }
        else if (is_dp_signaling_nan?(elem)) { result = 1 `<< 8; }
        else { result = 1 `<< 9; }
        V[vd + reg_off][end_bit:start_bit] = result[state.sew - 1:0];
      }
    }
  }
  CSR[vstart].VALUE = 0;
