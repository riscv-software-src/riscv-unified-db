# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vs8r.v
long_name: Vector store 8 elements with register stride
description: |
  Stores 8 segments of elements from vector register vs2 to memory starting at address in xs1 register with stride in xs2, using vector mask vm. The effective element width is determined by SEW setting.
definedBy:
  extension:
    name: Zvl32b
assembly: vs3, (xs1)
encoding:
  match: 111000101000-----000-----0100111
  variables:
    - name: xs1
      location: 19-15
    - name: vs3
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  XReg virtual_address = X[xs1];
  U32 nregs = 8;
  for (U32 i = 0; i < VLEN / 64 * nregs; i++) {
    U32 start_bit = (i * 64) % VLEN;
    U32 end_bit = start_bit + 63;
    U32 reg_off = i / (VLEN / 64);
    write_memory(64, virtual_address + (i * 8), V[vs3 + reg_off][end_bit:start_bit], $encoding);
  }
