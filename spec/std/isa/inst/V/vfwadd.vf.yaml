# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfwadd.vf
long_name: "Vector floating-point widening addition with scalar"
description: |
  Performs floating-point addition on elements from vector register vs2 and floating-point scalar register fs1, widens the results, and stores them in vector register vd, using vector mask vm. The operation follows IEEE 754 floating-point arithmetic rules.
definedBy:
  extension:
    anyOf:
      - name: Zvl32b
      - name: Zvfbfa
assembly: vd, vs2, fs1, vm
encoding:
  match: 110000-----------101-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  VectorState state = vector_state();
  RoundingMode mode = rm_to_mode(3'b111, $encoding);
  U32 src_elems_per_reg = VLEN >> state.log2_sew;
  U32 dst_elems_per_reg = VLEN >> (state.log2_sew + 1);
  Bits<32> fs1_f32 = f32_operand(F[fs1]);
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 src_reg_off = i / src_elems_per_reg;
      U32 src_start = (i % src_elems_per_reg) * state.sew;
      U32 src_end = src_start + state.sew - 1;
      U32 dst_reg_off = i / dst_elems_per_reg;
      U32 dst_start = (i % dst_elems_per_reg) * (state.sew << 1);
      U32 dst_end = dst_start + (state.sew << 1) - 1;
      if (state.sew == 16) {
        Bits<32> a = f16_to_f32(V[vs2 + src_reg_off][src_end:src_start]);
        Bits<32> b = f16_to_f32(f16_operand(F[fs1]));
        V[vd + dst_reg_off][dst_end:dst_start] = f32_add(a, b, mode);
      } else if (state.sew == 32) {
        Bits<64> a = f32_to_f64(V[vs2 + src_reg_off][src_end:src_start]);
        Bits<64> b = f32_to_f64(fs1_f32);
        V[vd + dst_reg_off][dst_end:dst_start] = f64_add(a, b, mode);
      }
    }
  }
  mark_f_state_dirty();
  CSR[vstart].VALUE = 0;
