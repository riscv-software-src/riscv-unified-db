# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmadc.vxm
long_name: "Vector integer add-with-carry-in-out scalar"
description: |
  Add each element from vector register vs2 to the scalar register xs1 and the respective carry-in from vector register v0, and write the respective carry-out to mask register vd. `vd.mask[i] = carry_out(vs2[i] + x[xs1] + v0.mask[i])`
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, v0
encoding:
  match: 0100010----------100-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
