# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmsbc.vx
long_name: "Vector integer subtract-with-borrow-out scalar"
description: |
  Subtract from each element of vector register vs2 the scalar register xs1, and write the respective borrow-out to mask register vd. There is no borrow-in. The borrow is defined to be 1 iff the difference, prior to truncation, is negative. `vd.mask[i] = borrow_out(vs2[i] - x[xs1])`
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1
encoding:
  match: 0100111----------100-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
