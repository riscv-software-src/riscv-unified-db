# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfncvt.xu.f.w
long_name: "Vector floating-point to unsigned integer narrowing conversion"
description: |
  Converts double-width floating-point elements from vector register vs2 to a single-width unsigned integer format and stores results in vector register vd, using vector mask vm. The conversion follows IEEE 754 rounding rules.
definedBy:
  extension:
    anyOf:
      - name: Zvl32b
      - name: Zvfbfa
assembly: vd, vs2, vm
encoding:
  match: 010010------10000001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  VectorState state = vector_state();
  RoundingMode mode = rm_to_mode(3'b111, $encoding);
  # Source has 2*SEW width (wider), destination has SEW width
  U32 src_elems_per_reg = VLEN >> (state.log2_sew + 1);
  U32 dst_elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 src_reg_off = i / src_elems_per_reg;
      U32 src_start = (i % src_elems_per_reg) * (state.sew << 1);
      U32 src_end = src_start + (state.sew << 1) - 1;
      U32 dst_reg_off = i / dst_elems_per_reg;
      U32 dst_start = (i % dst_elems_per_reg) * state.sew;
      U32 dst_end = dst_start + state.sew - 1;
      if (state.sew == 8) {
        Bits<16> elem = V[vs2 + src_reg_off][src_end:src_start];
        V[vd + dst_reg_off][dst_end:dst_start] = f32_to_ui8(f16_to_f32(elem), mode);
      } else if (state.sew == 16) {
        Bits<32> elem = V[vs2 + src_reg_off][src_end:src_start];
        V[vd + dst_reg_off][dst_end:dst_start] = f32_to_ui16(elem, mode);
      } else if (state.sew == 32) {
        V[vd + dst_reg_off][dst_end:dst_start] = f64_to_ui32(V[vs2 + src_reg_off][src_end:src_start], mode);
      }
    }
  }
  mark_f_state_dirty();
  CSR[vstart].VALUE = 0;
