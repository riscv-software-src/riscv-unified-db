# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsse16.v
long_name: "Vector strided store 16-bit elements"
description: |
  Stores 16-bit elements from vector register vs2 to memory starting at address in xs1 register with stride, using vector mask vm. The effective element width is 16 bits.
definedBy:
  extension:
    name: Zvl32b
assembly: vs3, (xs1), xs2, vm
encoding:
  match: 000010-----------101-----0100111
  variables:
    - name: vm
      location: 25-25
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vs3
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  XReg virtual_address = X[xs1];
  XReg stride = X[xs2];
  U32 elems_per_reg = VLEN / 16;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * 16;
      U32 end_bit = start_bit + 15;
      write_memory(16, virtual_address + i * stride, V[vs3 + reg_off][end_bit:start_bit], $encoding);
    }
  }
  CSR[vstart].VALUE = 0;
