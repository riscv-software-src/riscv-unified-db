# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmv.s.x
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, xs1
encoding:
  match: 010000100000-----110-----1010111
  variables:
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  if (CSR[vstart].VALUE != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  VectorState state = vector_state();

  if (CSR[vl].VALUE > 0) {
    V[vd][state.sew-1:0] = X[xs1][state.sew-1:0];
  }
