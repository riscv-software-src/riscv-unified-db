# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vcpop.m
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: xd, vs2, vm
encoding:
  match: 010000------10000010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  if (CSR[vstart].VALUE != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  XReg count = 0;
  for (U32 i = 0; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      if (V[vs2][i] == 1'b1) {
        count = count + 1;
      }
    }
  }
  X[xd] = count;
  CSR[vstart].VALUE = 0;
