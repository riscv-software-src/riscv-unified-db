# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: vssseg3e16.v
long_name: "Vector strided store 3 elements of 16 bits"
description: |
  Stores 3 segments of 16-bit elements from vector register vs2 to memory starting at address in xs1 register with stride, using vector mask vm. The effective element width is 16 bits.
definedBy:
  extension:
    name: Zvl32b
assembly: vs3, (xs1), xs2, vm
encoding:
  match: 010010-----------101-----0100111
  variables:
    - name: vm
      location: 25-25
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vs3
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  XReg virtual_address = X[xs1];
  XReg stride = X[xs2];
  U32 elems_per_reg = VLEN / 16;
  VectorState state = vector_state();
  XReg le_emul;
  XReg le_emul_log2_lmul = state.log2_lmul;
  XReg le_emul_log2_sew = state.log2_sew;
  if (state.lmul_type == VectorLmulType::Multiply) {
    le_emul = le_emul_log2_lmul + 4 - le_emul_log2_sew;
  } else {
    le_emul = 4 - le_emul_log2_sew - le_emul_log2_lmul;
  }
  U32 dat_emul;
  if ($signed(le_emul) > 0s) {
    dat_emul = 32'd1 << le_emul;
  } else {
    dat_emul = 1;
  }
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * 16;
      U32 end_bit = start_bit + 15;
      for (U32 f = 0; f < 3; f++) {
        write_memory(16, virtual_address + i * stride + f * 2, V[vs3 + f * dat_emul + reg_off][end_bit:start_bit], $encoding);
      }
    }
  }
  CSR[vstart].VALUE = 0;
