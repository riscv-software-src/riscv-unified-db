# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfnmacc.vf
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    anyOf:
      - name: Zvl32b
      - name: Zvfbfa
assembly: vd, fs1, vs2, vm
encoding:
  match: 101101-----------101-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  VectorState state = vector_state();
  RoundingMode mode = rm_to_mode(3'b111, $encoding);
  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;
      if (state.sew == 16) {
        Bits<16> a = V[vs2 + reg_off][end_bit:start_bit];
        Bits<16> b = f16_operand(F[fs1]);
        Bits<16> c = V[vd + reg_off][end_bit:start_bit] ^ 16'h8000;
        V[vd + reg_off][end_bit:start_bit] = f16_muladd(a, b, c, F32MulAddOp::Softfloat_mulAdd_subProd, mode);
      } else if (state.sew == 32) {
        Bits<32> vs2_elem = V[vs2 + reg_off][end_bit:start_bit];
        Bits<32> vd_elem  = V[vd  + reg_off][end_bit:start_bit];
        Bits<32> a = vs2_elem;
        Bits<32> b = f32_operand(F[fs1]);
        Bits<32> c = (vd_elem ^ (32'h1 `<< (state.sew - 1)));
        V[vd + reg_off][end_bit:start_bit] = f32_muladd(a, b, c, F32MulAddOp::Softfloat_mulAdd_subProd, mode);
      } else {
        Bits<64> vs2_elem = V[vs2 + reg_off][end_bit:start_bit];
        Bits<64> vd_elem  = V[vd  + reg_off][end_bit:start_bit];
        Bits<64> a = vs2_elem;
        Bits<64> b = F[fs1];
        Bits<64> c = (vd_elem ^ (64'h1 `<< (state.sew - 1)));
        V[vd + reg_off][end_bit:start_bit] = f64_muladd(a, b, c, F32MulAddOp::Softfloat_mulAdd_subProd, mode);
      }
    }
  }
  mark_f_state_dirty();
  CSR[vstart].VALUE = 0;
