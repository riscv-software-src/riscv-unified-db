# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vlm.v
long_name: Vector load mask
description: |
  Loads a vector mask from memory starting at address in xs1 register and stores it in vector register vd. This operation is used to load previously saved vector masks.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1)
encoding:
  match: 000000101011-----000-----0000111
  variables:
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  XReg virtual_address = X[xs1];
  U32 active_bytes = (CSR[vl].VALUE + 7) / 8;
  for (U32 i = 0; i < (VLEN / 8); i++) {
    U32 byte_start = i * 8;
    U32 byte_end = byte_start + 7;
    if (i < active_bytes) {
      V[vd][byte_end:byte_start] = read_memory(8, virtual_address + i, $encoding)[7:0];
    } else {
      if (CSR[vtype].VTA == 1'b1) {
        V[vd][byte_end:byte_start] = 8'hFF;
      }
    }
  }
  CSR[vstart].VALUE = 0;
