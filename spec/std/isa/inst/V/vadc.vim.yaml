# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vadc.vim
long_name: "Vector add with carry and masked"
description: |
  Performs addition on elements from vector register vs2 and immediate value, adds the carry-in from vector register vs3, and stores results in vector register vd, using vector mask vm. This variant includes additional masking behavior.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, imm, v0
encoding:
  match: 0100000----------011-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
      sign_extend: true
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();

  XReg sext_imm = $signed(imm);

  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit = start_bit + state.sew - 1;
    Bits<1> carry_in = V[0][i];
    V[vd + reg_off][end_bit:start_bit] = V[vs2 + reg_off][end_bit:start_bit] + sext_imm[state.sew-1:0] + carry_in;
  }

  CSR[vstart].VALUE = 0;
