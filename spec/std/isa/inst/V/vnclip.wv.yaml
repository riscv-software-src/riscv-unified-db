# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vnclip.wv
long_name: "Vector narrowing signed clip"
description: |
  Performs narrowing signed clip operation on double-width elements from vector register vs2 using clip values from vector register vs1 and stores results in vector register vd, using vector mask vm. The operation clips values to a specified range and packs the result into a narrower destination.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 101111-----------000-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  VectorLmulType lmul_type = state.lmul_type;

  XReg vlen = VLEN;
  XReg vlmax;
  if (lmul_type == VectorLmulType::Multiply) {
    vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
  }

  Bits<2> vxrm_mode = CSR[vcsr].VXRM;
  U32 elems_per_reg = VLEN >> state.log2_sew;
  Bits<64> one = 1;
  U32 src_elems_per_reg = VLEN >> (state.log2_sew + 1);


  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;

      U32 src_sew = state.sew << 1;
      U32 src_reg_off = i / src_elems_per_reg;
      U32 src_start = (i % src_elems_per_reg) * src_sew;
      U32 src_end = src_start + src_sew - 1;

      U32 shamt = V[vs1 + reg_off][end_bit:start_bit][state.log2_sew:0];
      Bits<64> a = $signed(V[vs2 + src_reg_off][src_end:src_start]);

      Bits<64> round_bit = 0;
      if (shamt > 0) {
        Bits<64> guard = (a >> (shamt - 1)) & 1;
        Bits<64> sticky = a & ((one << (shamt - 1)) - 1);
        Bits<64> res_lsb = (a >> shamt) & 1;
        if (vxrm_mode == 2'b00) {
          round_bit = guard;
        } else if (vxrm_mode == 2'b01) {
          round_bit = guard & (sticky != 0 ? 1'b1 : 1'b0 | res_lsb);
        } else if (vxrm_mode == 2'b10) {
          round_bit = 0;
        } else {
          round_bit = (res_lsb ^ 1'b1) & (guard != 0 ? 1'b1 : 1'b0 | (sticky != 0 ? 1'b1 : 1'b0));
        }
      }

      Bits<64> sign_bit_a = a[63:63];
      Bits<64> logical_shifted_a = a >> shamt;
      Bits<64> fill_a = (shamt == 0) ? 0 : ~((one << (64 - shamt)) - 1);
      Bits<64> shifted_raw = (sign_bit_a == 1) ? (logical_shifted_a | fill_a) : logical_shifted_a;
      Bits<64> shifted_sext = $signed(shifted_raw[src_sew-1:0]);
      Bits<64> result_full = shifted_sext + round_bit;
      Bits<64> sext_trunc = $signed(result_full[state.sew-1:0]);
      if (result_full != sext_trunc) {
        if (result_full[63:63] == 1'b0) {
          V[vd + reg_off][end_bit:start_bit] = ((one << state.sew) - 1) >> 1;
        } else {
          V[vd + reg_off][end_bit:start_bit] = one << (state.sew - 1);
        }
        CSR[vcsr].VXSAT = 1'b1;
      } else {
        V[vd + reg_off][end_bit:start_bit] = result_full[state.sew-1:0];
      }
    }
  }

  CSR[vstart].VALUE = 0;
