# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vle8.v
long_name: Vector 8-bit unit-stride load
description: |
  Loads 8-bit elements from memory starting at address in xs1 register, using vector mask vm, and stores results in vector register vd. The effective element width is 8 bits regardless of SEW setting. Supports vector masking and follows vector tail policy.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1), vm
encoding:
  match: 000000-00000-----000-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  XReg virtual_address = X[xs1];
  # "A simple in-order implementation can ignore the settings and simply execute all vector instructions using the undisturbed policy"
  U32 elems_per_reg = VLEN / 8;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * 8;
      U32 end_bit = start_bit + 7;
      V[vd + reg_off][end_bit:start_bit] = read_memory(8, virtual_address + i, $encoding)[7:0];
    }
  }
  CSR[vstart].VALUE = 0;
