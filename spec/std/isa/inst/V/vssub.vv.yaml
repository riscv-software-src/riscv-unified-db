# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vssub.vv
long_name: "Vector subtraction"
description: |
  Performs subtraction on elements from vector registers vs2 and vs1 and stores results in vector register vd, using vector mask vm.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 100011-----------000-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  VectorLmulType lmul_type = state.lmul_type;

  XReg vlen = VLEN;
  XReg vlmax;
  if (lmul_type == VectorLmulType::Multiply) {
    vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
  }

  U32 elems_per_reg = VLEN >> state.log2_sew;
  XReg one = 1;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;

      XReg a = $signed(V[vs2 + reg_off][end_bit:start_bit]);
      XReg b = $signed(V[vs1 + reg_off][end_bit:start_bit]);
      XReg sum = a - b;
      Boolean overflow = (state.sew == 64)
        ? (a[63:63] != b[63:63] && sum[63:63] != a[63:63])
        : ($signed(sum[state.sew-1:0]) != $signed(sum));
      XReg neg_dir = (state.sew == 64) ? a[63:63] : sum[63:63];
      if (overflow) {
        if (neg_dir == 1'b0) {
          V[vd + reg_off][end_bit:start_bit] = ((one << state.sew) - 1) >> 1;
        } else {
          V[vd + reg_off][end_bit:start_bit] = one << (state.sew - 1);
        }
        CSR[vcsr].VXSAT = 1'b1;
      } else {
        V[vd + reg_off][end_bit:start_bit] = sum[state.sew-1:0];
      }
    }
  }

  CSR[vstart].VALUE = 0;
