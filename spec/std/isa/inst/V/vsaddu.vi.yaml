# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsaddu.vi
long_name: "Vector signed addition with immediate"
description: |
  Performs signed addition on elements from vector register vs2 and immediate value and stores results in vector register vd, using vector mask vm. The operation follows standard signed arithmetic rules.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, imm, vm
encoding:
  match: 100000-----------011-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
      sign_extend: true
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  check_masked_vector_register_overlap(vm, vd, $encoding);
  check_vector_register_group(vd, $encoding);
  check_vector_register_group(vs2, $encoding);

  Bits<ELEN> sext_imm = $signed(imm);

  U32 elems_per_reg = VLEN >> state.log2_sew;
  Bits<ELEN `+ 1> one = 1;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;

      Bits<ELEN> a = V[vs2 + reg_off][end_bit:start_bit];
      Bits<ELEN> b = sext_imm[state.sew-1:0];
      Bits<ELEN `+ 1> sum = a `+ b;
      Bits<ELEN `+ 1> max_val = (one << state.sew) - 1;
      Boolean overflow = sum[state.sew] == 1'b1;

      if (overflow) {
        V[vd + reg_off][end_bit:start_bit] = max_val[state.sew-1:0];
        CSR[vcsr].VXSAT = 1'b1;
      } else {
        V[vd + reg_off][end_bit:start_bit] = sum[state.sew-1:0];
      }
    }
  }

  CSR[vstart].VALUE = 0;
