# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vs2r.v
long_name: "Vector store 2 whole registers"
description: |
  Stores 2 whole vector registers, starting at vs3, to memory starting at the address in xs1. This is a unit-stride, unmasked operation -- there is no stride or mask operand, and the operation does not depend on SEW.
definedBy:
  extension:
    name: Zvl32b
assembly: vs3, (xs1)
encoding:
  match: 001000101000-----000-----0100111
  variables:
    - name: xs1
      location: 19-15
    - name: vs3
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
