# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmv4r.v
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2
encoding:
  match: 1001111-----00011011-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  U32 evl = 4 * elems_per_reg;

  if (CSR[vstart].VALUE >= evl || vd % 4 != 0 || vs2 % 4 != 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  for (U32 i = CSR[vstart].VALUE; i < evl; i++) {
    U32 reg_off = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit = start_bit + state.sew - 1;
    V[vd + reg_off][end_bit:start_bit] = V[vs2 + reg_off][end_bit:start_bit];
  }
  CSR[vstart].VALUE = 0;
