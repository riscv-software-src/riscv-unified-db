# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vl1re16.v
long_name: "Vector load 1 whole register (EEW=16)"
description: |
  Loads 1 whole vector register from memory starting at the address in xs1, into the register group starting at vd. This is a unit-stride, unmasked operation -- there is no stride or mask operand. The effective element width is 16 bits, used only to determine the required alignment of vd.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1)
encoding:
  match: 000000101000-----101-----0000111
  variables:
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
