# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmadc.vv
long_name: "Vector integer add-with-carry-out vector"
description: |
  Add each element from vector register vs2 to the respective element from vector register vs1, and write the respective carry-out to mask register vd. There is no carry-in. `vd.mask[i] = carry_out(vs2[i] + vs1[i])`
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1
encoding:
  match: 0100011----------000-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
