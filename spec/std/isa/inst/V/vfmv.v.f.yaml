# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfmv.v.f
long_name: "Vector floating-point to vector move"
description: |
  Moves floating-point element from scalar register fs1 to vector register vd, using vector mask vm. This operation creates a vector with a single floating-point value.
definedBy:
  extension:
    anyOf:
      - name: Zvl32b
      - name: Zvfbfa
assembly: vd, fs1
encoding:
  match: 010111100000-----101-----1010111
  variables:
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = 0; i < CSR[vl].VALUE; i++) {
    U32 reg_off = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit = start_bit + state.sew - 1;
    V[vd + reg_off][end_bit:start_bit] = F[fs1][state.sew - 1:0];
  }
  mark_f_state_dirty();
  CSR[vstart].VALUE = 0;
