# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmfeq.vf
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    anyOf:
      - name: Zvl32b
      - name: Zvfbfa
assembly: vd, vs2, fs1, vm
encoding:
  match: 011000-----------101-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;
      if (state.sew == 16) {
        Bits<16> a = V[vs2 + reg_off][end_bit:start_bit];
        Bits<16> b = f16_operand(F[fs1]);
        if (is_hp_nan?(a) || is_hp_nan?(b)) {
          if (is_hp_signaling_nan?(a) || is_hp_signaling_nan?(b)) { set_fp_flag(FpFlag::NV); }
          V[vd][i] = 1'b0;
        } else { V[vd][i] = hp_equal?(a, b) ? 1'b1 : 1'b0; }
      } else if (state.sew == 32) {
        Bits<32> a = V[vs2 + reg_off][end_bit:start_bit];
        Bits<32> b = f32_operand(F[fs1]);
        Bits<1> sign_a = a[31:31];
        Bits<1> sign_b = b[31:31];
        if (is_sp_nan?(a) || is_sp_nan?(b)) {
          if (is_sp_signaling_nan?(a) || is_sp_signaling_nan?(b)) {
            set_fp_flag(FpFlag::NV);
          }
          V[vd][i] = 1'b0;
        } else {
          V[vd][i] = ((a == b) || ((a[30:0] | b[30:0]) == 0)) ? 1'b1 : 1'b0;
        }
      } else {
        Bits<64> a = V[vs2 + reg_off][end_bit:start_bit];
        Bits<64> b = F[fs1];
        Bits<1> sign_a = a[63:63];
        Bits<1> sign_b = b[63:63];
        if (is_dp_nan?(a) || is_dp_nan?(b)) {
          if (is_dp_signaling_nan?(a) || is_dp_signaling_nan?(b)) {
            set_fp_flag(FpFlag::NV);
          }
          V[vd][i] = 1'b0;
        } else {
          V[vd][i] = ((a == b) || ((a[62:0] | b[62:0]) == 0)) ? 1'b1 : 1'b0;
        }
      }
    }
  }
  mark_f_state_dirty();
  CSR[vstart].VALUE = 0;
