# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfmerge.vfm
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    anyOf:
      - name: Zvl32b
      - name: Zvfbfa
assembly: vd, vs2, fs1, v0
encoding:
  match: 0101110----------101-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  VectorState state = vector_state();
  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit = start_bit + state.sew - 1;
    if (V[0][i] == 1'b1) {
      if (state.sew == 32) {
        V[vd + reg_off][end_bit:start_bit] = F[fs1][31:0];
      } else {
        V[vd + reg_off][end_bit:start_bit] = F[fs1][63:0];
      }
    } else {
      V[vd + reg_off][end_bit:start_bit] = V[vs2 + reg_off][end_bit:start_bit];
    }
  }
  mark_f_state_dirty();
  CSR[vstart].VALUE = 0;
