# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmulh.vx
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 100111-----------110-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  VectorLmulType lmul_type = state.lmul_type;

  XReg vlen = VLEN;
  XReg vlmax;
  if (lmul_type == VectorLmulType::Multiply) {
    vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
  }

  XReg sext_xs1 = $signed(X[xs1]);

  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;
      XReg vs2_elem = $signed(V[vs2 + reg_off][end_bit:start_bit]);
      XReg vs1_elem = $signed(sext_xs1[state.sew-1:0]);
      if (state.sew == 64) {
        Boolean neg_result = (vs2_elem[63:63] != vs1_elem[63:63]);
        XReg abs_a = (vs2_elem[63:63] == 1'b1) ? -vs2_elem : vs2_elem;
        XReg abs_b = (vs1_elem[63:63] == 1'b1) ? -vs1_elem : vs1_elem;
        XReg hi = mul64Hi(abs_a, abs_b);
        XReg lo = abs_a * abs_b;
        if (neg_result) {
          hi = ~hi + ((lo == 0) ? 1 : 0);
        }
        V[vd + reg_off][end_bit:start_bit] = hi;
      } else {
        V[vd + reg_off][end_bit:start_bit] = (vs2_elem * vs1_elem)[2*state.sew-1:state.sew];
      }
    }
  }

  CSR[vstart].VALUE = 0;
