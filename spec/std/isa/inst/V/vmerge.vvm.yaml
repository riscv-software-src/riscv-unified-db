# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmerge.vvm
long_name: Vector merge with mask
description: |
  Merges elements from vs1 and vs2 using mask register v0 and stores results in vd. Where mask bits are set, elements from vs1 are selected; otherwise elements from vs2 are selected.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, v0
encoding:
  match: 0101110----------000-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();

  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit = start_bit + state.sew - 1;
    V[vd + reg_off][end_bit:start_bit] = (V[0][i] == 1'b1) ? V[vs1 + reg_off][end_bit:start_bit] : V[vs2 + reg_off][end_bit:start_bit];
  }

  CSR[vstart].VALUE = 0;
