# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmsbc.vv
long_name: "Vector subtract with borrow-out"
description: |
  Subtracts the source operands (vs2 - vs1) and writes the resulting borrow-out back to mask register vd. This is the unmasked form (vm=1), so there is no borrow-in. The borrow is defined to be 1 iff the difference, prior to truncation, is negative.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1
encoding:
  match: 0100111----------000-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
