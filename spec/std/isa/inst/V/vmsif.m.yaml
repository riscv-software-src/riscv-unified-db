# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmsif.m
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vm
encoding:
  match: 010100------00011010-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  if (CSR[vstart].VALUE != 0) {
    unpredictable("vmsif.m with vstart != 0 is reserved");
  }
  Boolean found = false;
  for (U32 i = 0; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      if (found) {
        V[vd][i] = 1'b0;
      } else {
        V[vd][i] = 1'b1;
        if (V[vs2][i] == 1'b1) {
          found = true;
        }
      }
    }
  }
  CSR[vstart].VALUE = 0;
