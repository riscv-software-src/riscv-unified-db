# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsuxei8.v
long_name: Vector unordered store 1 element of 8 bits with index
description: |
  Stores 1 segment of 8-bit elements from vector register vs2 to memory using unordered access pattern with index register vs1, starting at address in xs1 register, using vector mask vm. The effective element width is 8 bits.
definedBy:
  extension:
    name: Zvl32b
assembly: vs3, (xs1), vs2, vm
encoding:
  match: 000001-----------000-----0100111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vs3
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  XReg virtual_address = X[xs1];
  VectorState state = vector_state();
  U32 idx_elems_per_reg = VLEN / 8;
  U32 dat_elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 idx_reg_off = i / idx_elems_per_reg;
      U32 idx_start = (i % idx_elems_per_reg) * 8;
      XReg offset = V[vs2 + idx_reg_off][idx_start + 7:idx_start];
      XReg addr = virtual_address + offset;
      U32 dat_reg_off = i / dat_elems_per_reg;
      U32 dat_start = (i % dat_elems_per_reg) * state.sew;
      U32 dat_end = dat_start + state.sew - 1;
      if (state.sew == 8) {
        write_memory(8, addr, V[vs3 + dat_reg_off][dat_end:dat_start], $encoding);
      } else if (state.sew == 16) {
        write_memory(16, addr, V[vs3 + dat_reg_off][dat_end:dat_start], $encoding);
      } else if (state.sew == 32) {
        write_memory(32, addr, V[vs3 + dat_reg_off][dat_end:dat_start], $encoding);
      } else {
        write_memory(64, addr, V[vs3 + dat_reg_off][dat_end:dat_start], $encoding);
      }
    }
  }
  CSR[vstart].VALUE = 0;
