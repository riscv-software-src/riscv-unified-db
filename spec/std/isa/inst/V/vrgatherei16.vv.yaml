# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vrgatherei16.vv
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, vm
encoding:
  match: 001110-----------000-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  VectorLmulType lmul_type = state.lmul_type;

  # vs1 contains EEW=16 indices. At SEW=8 and LMUL=8, its EMUL would be
  # 16, which is reserved because vector register groups cannot exceed EMUL=8.
  if (state.sew == 8 && lmul_type == VectorLmulType::Multiply && state.log2_lmul == 3) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  XReg vlen = VLEN;
  XReg vlmax;
  if (lmul_type == VectorLmulType::Multiply) {
    vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
  }

  # Destination/source use SEW-wide elements
  U32 elems_per_reg = VLEN >> state.log2_sew;
  # Index (vs1) uses 16-bit elements always
  U32 idx_elems_per_reg = VLEN / 16;

  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;
      # 16-bit index from vs1
      U32 idx_reg_off = i / idx_elems_per_reg;
      U32 idx_start = (i % idx_elems_per_reg) * 16;
      U32 idx_end = idx_start + 15;
      XReg idx = V[vs1 + idx_reg_off][idx_end:idx_start];
      if (idx < vlmax) {
        U32 src_reg_off = idx / elems_per_reg;
        U32 src_start = (idx % elems_per_reg) * state.sew;
        U32 src_end = src_start + state.sew - 1;
        V[vd + reg_off][end_bit:start_bit] = V[vs2 + src_reg_off][src_end:src_start];
      } else {
        V[vd + reg_off][end_bit:start_bit] = 0;
      }
    }
  }

  CSR[vstart].VALUE = 0;
