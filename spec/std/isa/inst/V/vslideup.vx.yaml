# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vslideup.vx
long_name: "Vector slide up with scalar"
description: |
  Slides elements in vector register vs2 up by 1 position, inserting scalar register xs1 at the bottom, and stores results in vector register vd, using vector mask vm.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 001110-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();

  XReg offset = X[xs1];

  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 dst_start = i * state.sew;
    U32 dst_end = dst_start + state.sew - 1;
    if (i >= offset) {
      XReg src_idx = i - offset;
      U32 src_start = src_idx * state.sew;
      U32 src_end = src_start + state.sew - 1;
      V[vd][dst_end:dst_start] = V[vs2][src_end:src_start];
    }
    # Elements where i < offset are not written (keep vd value)
  }

  CSR[vstart].VALUE = 0;
