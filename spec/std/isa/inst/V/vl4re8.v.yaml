# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vl4re8.v
long_name: "Vector load 4 whole registers (EEW=8)"
description: |
  Loads 4 whole vector registers from memory starting at the address in xs1, into the register group starting at vd. This is a unit-stride, unmasked operation -- there is no stride or mask operand. The effective element width is 8 bits, used only to determine the required alignment of vd.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1)
encoding:
  match: 011000101000-----000-----0000111
  variables:
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
pseudoinstructions:
  - when: "true"
    to: vl4r.v vd, (xs1)
data_independent_timing: false
operation(): |
