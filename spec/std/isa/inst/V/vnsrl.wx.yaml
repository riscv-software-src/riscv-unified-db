# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vnsrl.wx
long_name: "Vector narrowing logical shift right with scalar"
description: |
  Performs narrowing logical right shift on double-width elements from vector register vs2 by shift amount from scalar register xs1 and stores results in vector register vd, using vector mask vm. The operation fills with zeros and writes a single-width destination.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 101100-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
pseudoinstructions:
  - when: xs1 == 0
    to: vncvt.x.x.w vd, vs2, vm
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  VectorLmulType lmul_type = state.lmul_type;

  XReg vlen = VLEN;
  XReg vlmax;
  if (lmul_type == VectorLmulType::Multiply) {
    vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
  } else {
    vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
  }

  U32 elems_per_reg = VLEN >> state.log2_sew;
  U32 src_elems_per_reg = VLEN >> (state.log2_sew + 1);

  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    if (vm == 1'b1 || V[0][i] == 1'b1) {
      U32 reg_off = i / elems_per_reg;
      U32 start_bit = (i % elems_per_reg) * state.sew;
      U32 end_bit = start_bit + state.sew - 1;

      U32 src_sew = state.sew << 1;
      U32 src_reg_off = i / src_elems_per_reg;
      U32 src_start = (i % src_elems_per_reg) * src_sew;
      U32 src_end = src_start + src_sew - 1;

      U32 shamt = X[xs1][state.log2_sew:0];

      XReg src = V[vs2 + src_reg_off][src_end:src_start];
      V[vd + reg_off][end_bit:start_bit] = (src >> shamt)[state.sew-1:0];
    }
  }

  CSR[vstart].VALUE = 0;
