# yaml-language-server: $schema=../../../schemas/profile_schema.json

$schema: profile_schema.json#
kind: profile
name: RVA23p1S64
long_name: S-mode extensions for version 23.1 of the 64-bit Apps Processor profile
marketing_name: RVA23p1S64
$inherits: "profile/RVA23S64.yaml#"
release: { $ref: profile_release/RVA23p1.yaml# }
introduction: |
  The RVA23p1S64 profile specifies the ISA features available to a
  supervisor-mode execution environment in 64-bit application processors.
  RVA23p1S64 is based on and requires an RVA23S64 implementation.
extensions:
  Svrsw60t59b:
    presence:
      optional: development
    version: ~> 1.0
  Ssdbltrp:
    presence:
      optional: development
    version: ~> 1.0
  Ssccfg:
    presence:
      optional: development
    version: ~> 1.0
  Ssctr:
    presence:
      optional: expansion
    version: ~> 1.0
  Ssqosid:
    presence:
      optional: expansion
    version: ~> 1.0
