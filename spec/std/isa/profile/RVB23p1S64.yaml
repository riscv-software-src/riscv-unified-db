# yaml-language-server: $schema=../../../schemas/profile_schema.json

$schema: profile_schema.json#
kind: profile
name: RVB23p1S64
long_name: S-mode extensions for version 23.1 of the 64-bit Bespoke Apps Processor profile
marketing_name: RVB23p1S64
$inherits: "profile/RVB23S64.yaml#"
release: { $ref: profile_release/RVB23p1.yaml# }
introduction: |
  The RVB23p1S64 profile specifies the ISA features available to a
  supervisor-mode execution environment in 64-bit application processors.
  RVB23p1S64 is based on and requires an RVB23S64 implementation.
extensions:
  Svrsw60t59b:
    presence:
      optional: development
    version: ~> 1.0
    note: Used to avoid optionality in Linux kernel page tables.
  Ssdbltrp:
    presence:
      optional: development
    version: ~> 1.0
    note: Included to make trap handling more robust.
  Ssccfg:
    presence:
      optional: expansion
    version: ~> 1.0
  Ssctr:
    presence:
      optional: expansion
    version: ~> 1.0
  Ssqosid:
    presence:
      optional: expansion
    version: ~> 1.0
