# yaml-language-server: $schema=../../../schemas/csr_schema.json

$schema: "csr_schema.json#"
kind: csr
name: mcycle
long_name: Machine Cycle Counter
definedBy:
  extension:
    name: Sm
address: 0xB00
writable: true
description: |
  Counts the number of clock cycles executed by the processor core on which
  the hart is running.
  The counter has 64-bit precision on all RV32 and RV64 harts.

  The `mcycle` CSR may be shared between harts on the same core, in which case
  writes to `mcycle` will be visible to those harts. The platform should provide
  a mechanism to indicate which harts share an `mcycle` CSR.
priv_mode: M
length: 64
fields:
  COUNT:
    alias:
      - cycle.COUNT
    location: 63-0
    type: RW-RH
    sw_write(csr_value): |
      # since writes to this register may not be hart-local, it must be handled
      # as a special case
      if (xlen() == 32) {
        return sw_write_mcycle({read_mcycle()[63:32], csr_value.COUNT[31:0]});
      } else {
        return sw_write_mcycle(csr_value.COUNT);
      }
    description: |
      Cycle counter.

      {%- if extensions.Zicntr -%}
      Aliased as `cycle.COUNT`.
      {%- endif -%}

      Increments every cycle unless:

        * `mcountinhibit.CY` {%- if extensions.Smcdeleg -%}or its alias `scountinhibit.CY`{%- endif -%} is set
        {%- if extensions.Smcntrpmf -%}
        * `mcyclecfg.MINH` is set and the current privilege level is M
        {%- if extensions.S -%}
        * `mcyclecfg.SINH` {%- if extensions.Ssccfg -%}or its alias `cyclecfg.SINH`{%- endif -%} is set and the current privilege level is (H)S
        {%- endif -%}
        {%- if extensions.U -%}
        * `mcyclecfg.UINH` {%- if extensions.Ssccfg -%}or its alias `cyclecfg.UINH`{%- endif -%} is set and the current privilege level is U
        {%- endif -%}
        {%- if extensions.H -%}
        * `mcyclecfg.VSINH` {%- if extensions.Ssccfg -%}or its alias `cyclecfg.VSINH`{%- endif -%} is set and the current privilege level is VS
        * `mcyclecfg.VUINH` {%- if extensions.Ssccfg -%}or its alias `cyclecfg.VUINH`{%- endif -%} is set and the current privilege level is VU
        {%- endif -%}
        {%- endif -%}
    reset_value: UNDEFINED_LEGAL
    affectedBy: [Zicntr, Smcntrpmf, Smcdeleg, Ssccfg]
sw_read(): |
  # since the counter may be shared among harts, reads must be handled
  # as a builtin function
  return read_mcycle();
