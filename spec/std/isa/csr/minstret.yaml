# yaml-language-server: $schema=../../../schemas/csr_schema.json

$schema: "csr_schema.json#"
kind: csr
name: minstret
long_name: Machine Instructions Retired Counter
address: 0xB02
writable: true
description: |
  Counts the number of instructions retired by this hart from some arbitrary start point in the past.

  [NOTE]
  Instructions that cause synchronous exceptions, including `ecall` and `ebreak`, are not
  considered to retire and hence do not increment the `minstret` CSR.
priv_mode: M
length: 64
fields:
  COUNT:
    location: 63-0
    type: RW-H
    description: |
      Instructions retired counter.

      {%- if extensions.Zicntr -%}
      Aliased as `instret.COUNT`.
      {%- endif -%}

      Increments every time an instruction retires unless:

        * `mcountinhibit.IR` {%- if extensions.Smcdeleg -%}or its alias `scountinhibit.IR`{%- endif -%} is set
        {%- if extensions.Smcntrpmf -%}
        * `minstretcfg.MINH` is set and the current privilege level is M
        {%- if extensions.S -%}
        * `minstretcfg.SINH` {%- if extensions.Ssccfg -%}or its alias `instretcfg.SINH`{%- endif -%} is set and the current privilege level is (H)S
        {%- endif -%}
        {%- if extensions.U -%}
        * `minstretcfg.UINH` {%- if extensions.Ssccfg -%}or its alias `instretcfg.UINH`{%- endif -%} is set and the current privilege level is U
        {%- endif -%}
        {%- if extensions.H -%}
        * `minstretcfg.VSINH` {%- if extensions.Ssccfg -%}or its alias `instretcfg.VSINH`{%- endif -%} is set and the current privilege level is VS
        * `minstretcfg.VUINH` {%- if extensions.Ssccfg -%}or its alias `instretcfg.VUINH`{%- endif -%} is set and the current privilege level is VU
        {%- endif -%}
        {%- endif -%}

      An instruction that causes an exception, notably including MRET/SRET,
      does not retire and does not cause `minstret.COUNT` to increment.
    reset_value: UNDEFINED_LEGAL
    affectedBy: [Zicntr, Smcntrpmf, Smcdeleg, Ssccfg]
definedBy:
  extension:
    name: Sm
