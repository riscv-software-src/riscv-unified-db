# yaml-language-server: $schema=../../../../schemas/csr_schema.json

$schema: "csr_schema.json#"
kind: csr
name: vsie
long_name: Virtual Supervisor Interrupt Enable
description: |
  The vsie register is a VSXLEN-bit read/write register that is VS-mode’s version of
  supervisor CSR sie. When V=1, vsie substitutes for the usual sie, so instructions that
  normally read or modify sie actually access vsie instead. However, interrupts directed to
  HS-level continue to be indicated in the HS-level sip register, not in vsip, when V=1.

  When bit 13 of hideleg is zero, vsie.LCOFIE is read-only zero. Else, vsie.LCOFIE is an alias of sie.LCOFIE.
  When bit 10 of hideleg is zero, vsie.SEIE is read-only zero. Else, vsie.SEIE is an alias of hie.VSEIE.
  When bit 6 of hideleg is zero, vsie.STIE is read-only zero. Else, vsie.STIE is an alias of hie.VSTIE.
  When bit 2 of hideleg is zero, vsie.SSIE is read-only zero. Else, vsie.SSIE is an alias of hie.VSSIE.
address: 0x204
virtual_address: 0x104
writable: true
priv_mode: VS
definedBy:
  extension:
    name: H
sw_read(): |
  XReg result = 0;
  if (CSR[hideleg].VSSI == 1) {
    result[1] = CSR[hie].VSSIE;
  }
  if (CSR[hideleg].VSTI == 1) {
    result[5] = CSR[hie].VSTIE;
  }
  if (CSR[hideleg].VSEI == 1) {
    result[9] = CSR[hie].VSEIE;
  }
  if (CSR[hideleg].LCOFI == 1) {
    result[13] = CSR[sie].LCOFIE;
  }
  return result;
length: VSXLEN
fields:
  SSIE:
    location: 1
    type: RW-H
    reset_value: UNDEFINED_LEGAL
    sw_write(csr_value): |
      if (CSR[hideleg].VSSI == 1) {
        CSR[hie].VSSIE = csr_value.SSIE;
      }
    description: |
      SSIE. Read-only zero when hideleg.VSSI is 0. Else, alias of hie.VSSIE.

  STIE:
    location: 5
    type: RW-H
    reset_value: UNDEFINED_LEGAL
    sw_write(csr_value): |
      if (CSR[hideleg].VSTI == 1) {
        CSR[hie].VSTIE = csr_value.STIE;
      }
    description: |
      STIE. Read-only zero when hideleg.VSTI is 0. Else, alias of hie.VSTIE.

  SEIE:
    location: 9
    type: RW-H
    reset_value: UNDEFINED_LEGAL
    sw_write(csr_value): |
      if (CSR[hideleg].VSEI == 1) {
        CSR[hie].VSEIE = csr_value.SEIE;
      }
    description: |
      SEIE. Read-only zero when hideleg.VSEI is 0. Else, alias of hie.VSEIE.

  LCOFIE:
    location: 13
    type: RW-H
    reset_value: UNDEFINED_LEGAL
    sw_write(csr_value): |
      if (CSR[hideleg].LCOFI == 1) {
        CSR[sie].LCOFIE = csr_value.LCOFIE;
      }
    description: |
      LCOFIE. Read-only zero when hideleg.LCOFI is 0. Else, alias of sie.LCOFIE.
