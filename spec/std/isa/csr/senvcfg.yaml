# yaml-language-server: $schema=../../../schemas/csr_schema.json

$schema: "csr_schema.json#"
kind: csr
name: senvcfg
address: 0x10A
writable: true
long_name: Supervisor Environment Configuration
description: |
  Contains fields that control certain characteristics of the U-mode execution environment.
priv_mode: S
length: SXLEN
definedBy:
  extension:
    allOf:
      - name: S
        version: ">=1.12"
      - name: U
fields:
  CBZE:
    location: 7
    description: |
      *Cache Block Zero instruction Enable*

      Bit is read-only 0 when `menvcfg.CBZE` is clear.

      Enables the execution of the cache block zero instruction, `cbo.zero`,
      in U-mode<% if ext?(:H) %> and (in conjunction with `henvcfg.CBZE`) VU-mode<% end %>.

        * `0`: The instruction raises an illegal instruction<% if ext?(:H) %> or virtual instruction exception<% end %>
        * `1`: The instruction is executed

      To summarize access:
      [separator="!",%autowidth]
      !===
      ! `menvcfg.CBZE` ! `senvcfg.CBZE` behavior

      ! 0 ! read-only 0
      ! 1
      a! writable, independent bit from `menvcfg.CBZE`
      !===

      See `cbo.zero` for a summary of the effect.

    definedBy:
      extension:
        name: Zicboz
    type: RW
    reset_value: UNDEFINED_LEGAL
  CBCFE:
    location: 6
    description: |
      *Cache Block Clean and Flush instruction Enable*

      Enables the execution of the cache block clean instruction, `cbo.clean`, and the
      cache block flush instruction, `cbo.flush`,
      <% if ext?(:S) %>
      in S-mode
      <% elsif ext?(:U) %>
      in U-mode
      <% end %>.

        * `0`: The instruction raises an illegal instruction <% if ext?(:H) %>or virtual instruction exception<% end %>
        * `1`: The instruction is executed

      To summarize access:
      [separator="!",%autowidth]
      !===
      ! `menvcfg.CBCFE` ! `senvcfg.CBCFE` behavior

      ! 0 ! read-only 0
      ! 1
      a! writable, independent bit from `menvcfg.CBCFE`
      !===

      See `cbo.clean` and/or `cbo.flush` for a summary of the effect.

    definedBy:
      extension:
        name: Zicbom
    type: RW
    reset_value: UNDEFINED_LEGAL
  CBIE:
    location: 5-4
    description: |
      *Cache Block Invalidate instruction Enable*

      The legal values of this field do not depend on `menvcfg.CBIE`.
      When the reserved value `10` is written, it is ignored and the field remains unchanged.

      Execution of `cbo.inval` in U-mode is enabled only if it is also enabled in S-mode
      by `menvcfg.CBIE`. If `menvcfg.CBIE` is `01`, an enabled `cbo.inval` performs a
      flush operation in U-mode even if `senvcfg.CBIE` is `11`.

      Controls execution of the cache block invalidate instruction, `cbo.inval`,
      in U-mode
      <% if ext?(:H) %>
      and VU-mode (together with `henvcfg.CBIE`)
      <% end %>
      .

        * `00`: The instruction raises an illegal instruction or virtual instruction exception
        * `01`: The instruction is executed and performs a flush operation
        * `10`: _Reserved_
        * `11`: The instruction is executed and performs an invalidate operation

      See `cbo.inval` for more details.
    definedBy:
      extension:
        name: Zicbom
    type: RW-R
    sw_write(csr_value): |
      if (csr_value.CBIE == 0 || csr_value.CBIE == 1 || csr_value.CBIE == 3) {
        return csr_value.CBIE;
      }
      return CSR[senvcfg].CBIE;
    reset_value: UNDEFINED_LEGAL
  UKTE:
    location: 8
    description: |
      If the Svukte extension is implemented, the UKTE field affects the behavior of
      instruction fetches and explicit memory accesses.
      When UKTE=0, instruction fetches and explicit memory accesses proceed as
      though the Svukte extension were not implemented.
      When UKTE=1, instruction fetches and explicit memory accesses with effective
      privilege mode U or VU are Svukte-qualified, as described in <<sec:svukte>>.
      If Svukte is not implemented, UKTE is read-only zero.

    definedBy:
      extension:
        name: Svukte
    type: RW
    reset_value: UNDEFINED_LEGAL
  SSE:
    location: 3
    description: |
      *Shadow Stack Enable*

      When the SSE field is set to 1, the Zicfiss extension is
      activated in VU/U-mode. When the SSE field is 0, the Zicfiss extension remains inactive
      in VU/U-mode, and the following rules apply:

        - 32-bit Zicfiss instructions will revert to their behavior as defined by Zimop.

        - 16-bit Zicfiss instructions will revert to their behavior as defined by Zcmop.

        - When menvcfg.SSE is one, SSAMOSWAP.W/D raises an illegal-instruction exception in U-mode
          and a virtual-instruction exception in VU-mode.
    definedBy:
      extension:
        name: Zicfiss
    type: RW
    reset_value: UNDEFINED_LEGAL
    sw_write(csr_value): |
      if (CSR[menvcfg].SSE == 0 || CSR[henvcfg].SSE == 0){
        return 0;
      }
      return csr_value.SSE;
  LPE:
    location: 2
    description: |
      *Landing Pad Enable*

      When the LPE field is set to 1 and `menvcfg.LPE` is 1, the Zicfilp extension
      is enabled in U/VU-mode. Read-only zero when `menvcfg.LPE` is 0. When the LPE
      field is 0, the Zicfilp extension is not enabled in U/VU-mode and the following
      rules apply:

        * The hart does not update the `ELP` state; it remains as `NO_LP_EXPECTED`.
        * The `LPAD` instruction operates as a no-op.
    definedBy:
      extension:
        name: Zicfilp
    type: RW
    reset_value: UNDEFINED_LEGAL
    sw_write(csr_value): |
      if (CSR[menvcfg].LPE == 0) {
        return 0;
      }
      return csr_value.LPE;
  FIOM:
    location: 0
    description: |
      *Fence of I/O implies Memory*

      When either `senvcfg.FIOM` or `menvcfg.FIOM` is set,
      FENCE instructions ordering I/O regions also implicitly order memory regions when executed
      in U-mode as follows:

      [separator="!",%autowidth,float="center",align="center",cols="^,<",options="header"]
      !===
      !Instruction bit !Meaning when set
      !PI +
      PO
      !Predecessor device input and memory reads (PR implied) +
      Predecessor device output and memory writes (PW implied)
      !SI +
      SO
      !Successor device input and memory reads (SR implied) +
      Successor device output and memory writes (SW implied)
      !===

      Similarly, in U-mode when FIOM=1, if an atomic
      instruction that accesses a region ordered as device I/O has its _aq_
      and/or _rl_ bit set, then that instruction is ordered as though it
      accesses both device I/O and memory.

      See `fence` for more details.

    type: RW
    reset_value: 0
sw_read(): |
  Bits<64> value = $bits(CSR[senvcfg]);
  if (implemented?(ExtensionName::Zicfiss) && (CSR[menvcfg].SSE == 0 || CSR[henvcfg].SSE == 0)) {
    # senvcfg.SSE must read-as-zero
    value = value & ~(1 `<< 3);
  }
  if (implemented?(ExtensionName::Zicfilp) && CSR[menvcfg].LPE == 0) {
    # senvcfg.LPE must read-as-zero when menvcfg.LPE is 0
    value = value & ~(1 `<< 2);
  }
  return value;
