# yaml-language-server: $schema=tests-schema.json

---
tests:
  regress-python-config-headers:
    ci_stage: pr
    tags:
      - integration
      - smoke
    gh_pre:
      - name: Install source acceptance tools
        run: sudo apt-get update -qq && sudo apt-get install -y gcc verilator
    test:
      - name: Generate configuration header artifacts with installed Python CLI
        run: |
          uv run --locked udb generate cfg-c-header -c cfgs/mc100-32-full-example.yaml -o gen/config-headers/config.h
          uv run --locked udb generate cfg-svh-header -c cfgs/mc100-32-full-example.yaml -o gen/config-headers/config.svh
          cmp gen/config-headers/config.h tests/golden/mc100-32-full-example.golden.h
          cmp gen/config-headers/config.svh tests/golden/mc100-32-full-example.golden.svh
      - name: Check configuration header bytes and C/SystemVerilog consumers
        run: UDB_TEST_HEADER_TOOLS=1 uv run --locked python -m pytest -n 8 --basetemp=gen/config-headers/pytest tests/python/test_config_headers.py -k "not live_ruby"
      - name: Compare complete configuration header artifacts with Ruby
        run: UDB_TEST_RUBY=1 uv run --locked python -m pytest -n 0 --basetemp=gen/config-headers/pytest-ruby tests/python/test_config_headers.py -k live_ruby

  regress-python-profile-configs:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Compare the frozen profile configuration oracle with live Ruby
        run: >-
          UDB_TEST_RUBY=1 uv run --locked python -m pytest -n 0
          tests/python/test_profile_configs.py -k live_profile_configuration_oracle
      - name: Check native profile generation and CLI behavior
        run: uv run --locked python -m pytest -n 8 tests/python/test_profile_configs.py

  regress-python-conditions-parity:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Compare Python condition evaluation and solving with Ruby
        run: UDB_TEST_RUBY=1 uv run --locked python -m pytest tests/python/test_conditions.py

  regress-python-configured-parity:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Compare Python configured architecture queries with Ruby
        run: UDB_TEST_RUBY=1 uv run --locked python -m pytest tests/python/test_architecture.py

  regress-python-configuration-parity:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Compare Python and Ruby configuration parsing
        run: UDB_TEST_RUBY=1 uv run --locked python -m pytest tests/python/test_configuration_parity.py

  regress-python-domain-parity:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Compare Python parameter domains with Ruby schema validation
        run: UDB_TEST_RUBY=1 uv run --locked python -m pytest tests/python/test_domains.py

  regress-python-versions-parity:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Compare Python and Ruby RISC-V version semantics
        run: UDB_TEST_RUBY=1 uv run --locked python -m pytest tests/python/test_versions.py

  regress-python-resolution-parity:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Compare Python and Ruby YAML resolution on the standard database
        run: UDB_TEST_RUBY=1 uv run --locked python -m pytest tests/python/test_resolution_parity.py

  regress-python-idl-syntax-parity:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Compare Python and Ruby IDL syntax parsing on the standard and custom databases
        run: UDB_TEST_RUBY=1 uv run --locked python -m pytest tests/python/test_idl_parity.py

  regress-python-idl-expression-parity:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Compare Python and Ruby IDL expression type-checking and constant evaluation
        run: UDB_TEST_RUBY=1 uv run --locked python -m pytest tests/python/test_idl_expressions.py

  regress-python-idl-statement-parity:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Compare Python and Ruby IDL statements and function semantics
        run: >-
          UDB_TEST_RUBY=1 uv run --locked python -m pytest -n 0
          tests/python/test_idl_arrays.py
          tests/python/test_idl_const_function_arguments.py
          tests/python/test_idl_constraints.py
          tests/python/test_idl_control_flow.py
          tests/python/test_idl_csr_operations.py
          tests/python/test_idl_functions.py
          tests/python/test_idl_includes.py
          tests/python/test_idl_loops.py
          tests/python/test_idl_register_files.py
          tests/python/test_idl_reserved_words.py
          tests/python/test_idl_statements_corpus.py
          tests/python/test_idl_strictness_and_unknowns.py
          tests/python/test_idl_type_checking_comprehensive.py
          tests/python/test_idl_type_checking_data_driven.py
          tests/python/test_idl_variables.py
          tests/python/test_idl_statement_regressions.py
          tests/python/test_idl_statement_review_regressions.py
          tests/python/test_idl_conditional_assignment_correction.py
          tests/python/test_idl_return_state_review.py
          tests/python/test_idl_return_abort_regressions.py
          tests/python/test_idl_partial_array_unknown_review.py
          tests/python/test_idl_partial_array_unknown_regressions.py

  regress-python-idl-architecture:
    ci_stage: pr
    tags:
      - integration
    test:
      - name: Check captured sources and all available IDL architecture bodies
        run: >-
          uv run --locked python -m pytest -n 0
          tests/python/test_configuration_idl_source.py
          tests/python/test_database_idl_sources.py
          tests/python/test_idl_environment.py
          tests/python/test_idl_environment_fixes.py
          tests/python/test_idl_environment_review.py
          tests/python/test_idl_architecture_adapter.py
          tests/python/test_idl_architecture_review_fixes.py
          tests/python/test_idl_architecture_review_regressions.py
          tests/python/test_idl_csr_protocol_review.py
          tests/python/test_idl_csr_symbolic_base_review.py
          tests/python/test_idl_native_descriptor_integration.py
          tests/python/test_idl_effective_xlen_review.py
          tests/python/test_idl_unavailable_body_review.py
          tests/python/test_idl_unavailable_body_edges.py
          tests/python/test_idl_rori_source_review.py
          tests/python/test_idl_qc_ilut_source_review.py
          tests/python/test_idl_architecture_real.py

  regress-python-idl-pass-parity:
    ci_stage: pr
    tags:
      - unit
      - integration
    test:
      - name: Check standalone analysis, rendering and real-source pass parity
        run: >-
          uv run --locked python -m pytest -n 0
          tests/python/test_idl_adoc.py
          tests/python/test_idl_prune.py
          tests/python/test_idl_reachability.py
          tests/python/test_idl_register_discovery.py
          tests/python/test_idl_return_values.py
          tests/python/test_idl_passes_corpus.py
          tests/python/test_idl_passes_pruning_unit.py
          tests/python/test_idl_passes_reachability_unit.py
          tests/python/test_idl_passes_discovery_unit.py
          tests/python/test_idl_passes_returns_unit.py
          tests/python/test_idl_passes_hart_unit.py
          tests/python/test_idl_passes_decode_tree_unit.py
          tests/python/test_idl_passes_csr_pruning_unit.py
          tests/python/test_idl_passes_real_adapter_unit.py
          tests/python/test_idl_passes_review_regressions.py
          tests/python/test_idl_passes_rendered_guards_review.py
          tests/python/test_idl_passes_nested_index_review.py
          tests/python/test_idl_passes_scope_review_unit.py
          tests/python/test_idl_passes_write_scope_unit.py
          tests/python/test_idl_passes_carried_array_context_unit.py
          tests/python/test_idl_passes_exception_specialization_review.py
          tests/python/test_idl_passes_assignment_binding_adjudication_unit.py
          tests/python/test_idl_passes_real_corrections_review.py
          tests/python/test_idl_passes_real.py

  regress-python-idl-condition-parity:
    ci_stage: pr
    tags:
      - unit
      - integration
    test:
      - name: Compare frozen IDL conditions and environment callbacks with live Ruby
        run: >-
          UDB_TEST_RUBY=1 uv run --locked python -m pytest -n 0
          tests/python/test_idl_conditions.py::test_frozen_ruby_condition_corpus_is_current
          tests/python/test_idl_environment.py::test_idl_environment_matches_ruby_oracle
      - name: Check symbolic IDL conditions, compiled requirements and genuine hooks
        run: >-
          uv run --locked python -m pytest -n 2
          tests/python/test_idl_conditions.py
          tests/python/test_idl_condition_bootstrap.py
          tests/python/test_idl_condition_integration.py
          tests/python/test_idl_condition_loop_controls.py
          tests/python/test_idl_condition_loop_symbolic_review.py
          tests/python/test_idl_condition_runtime.py
          tests/python/test_config_validation_cli.py
          tests/python/test_idl_environment_oracle_corrections_review.py
          tests/python/test_idl_environment.py::test_rv32_sxlen_invariant_prohibits_64_bit_supervisor_extensions
          tests/python/test_schema_idl_conditions.py
          tests/python/test_solver_arrays.py::test_shipped_configuration_solver_construction_and_queries

  regress-python-layout-drift:
    ci_stage: pr
    tags:
      - smoke
    test:
      - name: Check layout-derived architecture files
        run: uv run --locked udb generate-layouts --root . --check

  regress-python-configured-prose-frozen:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Compare configured prose with frozen Ruby outputs and source inventory
        run: uv run --locked python -m pytest tests/python/test_configured_prose.py tests/python/test_configured_prose_oracle.py -n 8 --basetemp=gen/prose-tests

  regress-python-unit:
    ci_stage: pr
    tags:
      - unit
      - smoke
    test:
      - name: Test the Python database package
        run: uv run --locked python -m pytest tests/python

  regress-scripts-unit:
    ci_stage: pr
    tags:
      - unit
      - smoke
    test:
      - name: Run tools/scripts unit tests
        run: ./bin/ruby -Itools/scripts tools/scripts/test/run.rb

  regress-idlc-unit:
    ci_stage: pr
    tags:
      - unit
      - smoke
    test:
      - name: Run idlc unit tests
        run: ./do test:idlc:unit
    gh_post:
      - name: Upload idlc coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: tools/ruby-gems/idlc/coverage/coverage.xml
          flags: idlc

  regress-udb-helpers-unit:
    ci_stage: pr
    tags:
      - unit
      - smoke
    test:
      - name: Run udb-helpers unit tests
        run: ./do test:udb_helpers:unit

  regress-udb-gen-unit:
    ci_stage: pr
    tags:
      - unit
      - smoke
    test:
      - name: Check udb-gen unit tests
        run: ./do test:udb_gen:unit

  regress-udb-gen-integration:
    ci_stage: pr
    tags:
      - integration
      - smoke
    test:
      - name: Check udb-gen integration tests
        run: ./do test:udb_gen:integration
      - name: Check native instruction tables and CLI
        run: >-
          uv run --locked python -m pytest -n 8
          tests/python/test_instruction_table.py
          tests/python/test_instruction_table_formats.py
          tests/python/test_instruction_table_bundled.py
          tests/python/test_instruction_table_cli.py

  regress-udb-gen-chore:
    ci_stage: pr
    tags:
      - smoke
    test:
      - name: Generate udb-gen golden files
        run: ./bin/chore gen -f udb-gen

  regress-sorbet:
    ci_stage: pr
    tags:
      - smoke
    test:
      - name: Run sorbet checks
        run: ./do test:sorbet

  regress-ext-explorer:
    ci_stage: pr
    test:
      - name: Generate ISA Explorer browser artifacts
        run: ./bin/udb-gen isa-explorer -t ext-browser -o gen/isa_explorer --skip 6

  regress-idl-typecheck-smoke:
    ci_stage: pr
    tags:
      - smoke
    strategy:
      matrix:
        cfg:
          - rv64 # a simple standard config
          - qc_iu # a config with overlay
    test:
      - name: Type check IDL for ${{ matrix.cfg }}
        run: ./do test:idl CFG=${{ matrix.cfg }}

  regress-idl-typecheck-other:
    ci_stage: pr
    strategy:
      matrix:
        cfg:
          - _
          - rv32
    test:
      - name: Type check IDL for ${{ matrix.cfg }}
        run: ./do test:idl CFG=${{ matrix.cfg }}

  regress-test-inst-encodings:
    ci_stage: pr
    tags:
      - smoke
    test:
      - name: Checking for conflicts in instruction encodings
        run: ./do test:inst_encodings

  regress-gen-isa-manual:
    ci_stage: pr
    gh_pre:
      - name: checkout ISA manual
        run: git submodule update --init ext/riscv-isa-manual
      - name: Mark isa-manual as safe
        # Run in docker to get git config set correctly for submodules
        run: ./bin/bash -c "git config --local --add safe.directory '*'"
    test:
      - name: Generate HTML ISA manual
        run: ./bin/generate manual -c regress -v isa_regress -f html

  regress-gen-instruction-appendix:
    ci_stage: pr
    test:
      - name: Generate instruction appendix asciidoc
        run: ./do gen:instruction_appendix_adoc
      - name: Check instruction appendix result
        run: ./do test:instruction_appendix

  regress-cfg-manual:
    ci_stage: pr
    test:
      - name: Generate HTML ISA manual
        run: ./do gen:html[example_rv64_with_overlay]

  regress-gen-ext-pdf:
    ci_stage: pr
    test:
      - name: Generate Xqci extension PDF
        run: ./bin/ruby tools/scripts/gen_xqci.rb

  regress-gen-profile:
    ci_stage: pr
    test:
      - name: Generate extension PDF
        run: ./do gen:profile_release_pdf[RVI20]

  regress-profile-strict-cfg:
    ci_stage: pr
    tags:
      - smoke
    test:
      - name: Check that profile configs are up to date
        run: ./bin/chore gen -f profile-cfgs

  regress-udb-unit-test:
    ci_stage: pr
    tags:
      - unit
    strategy:
      matrix:
        test:
          - logic
          - conditions
          - database_obj_compare
          - cli
          - yaml_loader
          - cfg_arch
          - cfg
          - csr
          - mmr
          - mmr_schema
          - schema_versioning
          - instruction
          - z3
          - z3_extensions
          - z3_finite_array
          - z3_parameter_constraints
    test:
      - name: Run udb gem ${{ matrix.test }} unit tests
        run: ./bin/ruby tools/ruby-gems/udb/test/test_${{ matrix.test }}.rb
    gh_post:
      - name: Rename coverage file
        run: mv tools/ruby-gems/udb/coverage/.resultset.json tools/ruby-gems/udb/coverage/${{ matrix.test }}.resultset.json
      - name: Save coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: udb-${{ matrix.test }}-cov
          path: tools/ruby-gems/udb/coverage/${{ matrix.test }}.resultset.json

  regress-gen-go:
    ci_stage: pr
    test:
      - name: Generate Go code
        run: ./do gen:go

  regress-gen-c-header:
    ci_stage: pr
    test:
      - name: Generate c_header code
        run: ./do gen:c_header

  regress-gen-sverilog:
    ci_stage: pr
    test:
      - name: Generate sverilog_header code
        run: ./do gen:sverilog

  regress-cfg-headers:
    ci_stage: pr
    tags:
      - smoke
    test:
      - name: Generate cfg header golden files
        run: ./bin/chore gen -f cfg-headers

  regress-cpp-unit:
    ci_stage: pr
    toolchain_container: true
    tags:
      - unit
    test:
      - name: Run cpp unit tests
        run: ./do test:cpp_hart CONFIG=rv64 JOBS=4 BUILD_TYPE=debug

  regress-riscv-tests-32:
    ci_stage: pr
    toolchain_container: true
    gh_pre:
      - name: check out riscv-tests
        run: git submodule update --init ext/riscv-tests
    test:
      - name: Run RV32 riscv-tests
        run: ./do test:riscv_tests CONFIG=rv32 IGNOREUNDEFINED=YES JOBS=4 BUILD_TYPE=debug

  regress-riscv-tests-64:
    ci_stage: pr
    toolchain_container: true
    gh_pre:
      - name: check out riscv-tests
        run: git submodule update --init ext/riscv-tests
    test:
      - name: Run RV64 riscv-tests
        run: ./do test:riscv_tests CONFIG=rv64 IGNOREUNDEFINED=YES JOBS=4 BUILD_TYPE=debug

  regress-riscv-tests-vector:
    ci_stage: pr
    toolchain_container: true
    gh_pre:
      - name: check out riscv-tests
        run: git submodule update --init ext/riscv-tests
    test:
      - name: Run vector riscv-tests
        run: ./do test:riscv_vector_tests CONFIG=rv64-vector IGNOREUNDEFINED=YES JOBS=4 BUILD_TYPE=debug

  regress-profile-extensions:
    ci_stage: pr
    test:
      - name: Check profile_extensions
        run: ./do test:profile_extensions

  regress-build-udb-gem:
    ci_stage: pr
    tags:
      - smoke
    test:
      - name: Build udb gem via chore
        run: ./bin/chore build udb-gem
      - name: Verify udb gem was built
        run: ls gen/udb_gem/udb-*.gem

  regress-regress:
    ci_stage: pr
    test:
      - name: Test that local regress runner works
        run: ./bin/regress -n regress-sorbet

  build-reuse-manifest:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: reuse-manifest
        path: reuse_bom.txt
    tags: [artifacts]
    test:
      - name: Create reuse manifest
        run: ./bin/reuse spdx -o reuse_bom.txt

  build-udb-api-docs:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: udb-api
        path: gen/udb_api_doc
        include-hidden-files: true
    tags: [artifacts]
    test:
      - name: Generate UDB API Docs
        run: ./do gen:udb:api_doc

  resolve-unconfig:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: resolved-spec
        path: gen/resolved_spec/_
        include-hidden-files: true
    tags: [artifacts]
    test:
      - name: Resolve Unconfig with IDL AST
        run: ./do gen:resolved_arch COMPILE_IDL=1
      - name: Tar unconfig
        run: tar czf gen/resolved_spec/_resolved_spec.tar.gz gen/resolved_spec/_ && mv gen/resolved_spec/_resolved_spec.tar.gz gen/resolved_spec/_/resolved_spec.tar.gz

  build-isa-explorer-csr:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: isa-explorer-csr
        path: gen/isa_explorer/browser
    tags: [artifacts]
    test:
      - name: Generate ISA Explorer CSR
        run: ./bin/udb-gen isa-explorer -t csr-browser -o gen/isa_explorer/browser

  build-isa-explorer-ext:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: isa-explorer-ext
        path: gen/isa_explorer/browser
    tags: [artifacts]
    test:
      - name: Generate ISA Explorer Extension
        run: ./bin/udb-gen isa-explorer -t ext-browser -o gen/isa_explorer/browser

  build-isa-explorer-inst:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: isa-explorer-inst
        path: gen/isa_explorer/browser
    tags: [artifacts]
    test:
      - name: Generate ISA Explorer Instruction
        run: ./bin/udb-gen isa-explorer -t inst-browser -o gen/isa_explorer/browser

  build-isa-explorer-spreadsheet:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: isa-explorer-spreadsheet
        path: gen/isa_explorer/spreadsheet
    test:
      - name: Generate ISA Explorer Spreadsheet
        run: ./bin/udb-gen isa-explorer -t xlsx -o gen/isa_explorer/spreadsheet

  build-html-isa-manual:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: isa-html-manual
        path: gen/manual/isa/top/all/html
    tags: [artifacts]
    test:
      - name: Generate HTML ISA manual
        run: ./bin/generate manual -v all -f html

  build-html-cfg-isa-manual:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: cfg-html-manual
        path: gen/cfg_html_doc/example_rv64_with_overlay/html
    tags: [artifacts]
    test:
      - name: Generate HTML ISA manual for a config
        run: ./do gen:html[example_rv64_with_overlay]

  build-instruction-appendix:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: inst-appendix
        path: gen/instructions_appendix/instructions_appendix.pdf
    gh_pre:
      - name: checkout docs resources
        run: git submodule update --init ext/docs-resources
    tags: [artifacts]
    test:
      - name: Generate instruction appendix
        run: ./do gen:instruction_appendix

  build-profile:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: ${{ matrix.profile }}
        path: gen/profile/pdf/${{ matrix.profile }}ProfileRelease.pdf
    strategy:
      matrix:
        profile:
          - RVI20
          - RVA20
          - RVA22
          - RVA23
          - RVB23
    tags: [artifacts]
    test:
      - name: Generate ${{ matrix.profile }}
        run: |
          PROFILE_NAME="${{ matrix.profile }}"
          ./do gen:profile_release_pdf[${PROFILE_NAME}]

  regress-schema-versions:
    ci_stage: pr
    tags:
      - smoke
    test:
      - name: Check schema versions against published URLs
        run: uv run --locked udb --schemas spec/schemas schemas gen/schemas && ./bin/python tools/scripts/check_schema_versions.py

  regress-schema-docs:
    ci_stage: pr
    tags:
      - smoke
    checkout_with:
      fetch-depth: 0
    test:
      - name: Check schema documentation without rewriting released pages
        run: ./bin/python -m udb generate schema-docs --schemas spec/schemas --out doc/docs/schemas --check
      - name: Check old schema MDX files were not modified
        run: |
          base="$(git merge-base origin/main HEAD)"
          changed_old_docs="$(
            git diff --name-only --diff-filter=ACDMRT "$base" HEAD -- 'doc/docs/schemas/*/*.mdx' \
              | while IFS= read -r doc; do
                  schema="spec/schemas/$(basename "$doc" .mdx).json"
                  version="$(basename "$(dirname "$doc")")"
                  current_version="$(./bin/python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(json.loads(p.read_text()).get("$id", "") if p.exists() else "")' "$schema")"
                  [ "$version" = "$current_version" ] || printf '%s\n' "$doc"
                done
          )"
          if [ -n "$changed_old_docs" ]; then
            echo "ERROR: Schema docs for old versions changed:"
            echo "$changed_old_docs"
            echo
            echo "Schema documentation for old schema versions is immutable. To update docs for a schema change:"
            echo '  1. Increment the "$id" value in the modified schema file.'
            echo "  2. Restore the old doc file(s) listed above."
            echo "  3. The new versioned doc page will be generated automatically by autofix."
            exit 1
          fi

  build-idl-doc:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: idl-doc
        path: idl.html
    tags: [artifacts]
    test:
      - name: Build IDL doc
        run: ./bin/bundle exec asciidoctor -r idl_highlighter -a toc=left -a source-highlighter=rouge -o idl.html doc/idl.adoc

  check-gem-versions:
    ci_stage: pr
    tags:
      - smoke
    checkout_with:
      fetch-depth: 0
    test:
      - name: Check gem versions, pins, and lock files are up to date
        run: ./bin/chore gen -f gem-versions
      - name: Check lockfiles have no drift after re-locking
        run: |
          git diff --exit-code -- \
            Gemfile.lock \
            tools/ruby-gems/idlc/Gemfile.lock \
            tools/ruby-gems/udb/Gemfile.lock \
            tools/ruby-gems/udb-gen/Gemfile.lock \
            tools/ruby-gems/udb_helpers/Gemfile.lock

  regress-smoke-perf:
    ci_stage: pr
    timeout_minutes: 10
    test:
      - name: Run smoke regression suite (must complete within 10 minutes)
        run: ./bin/regress -t smoke

  build-docs-site:
    ci_stage: merge_queue
    gh_save_artifact:
      - artifact_name: docs-site
        path: doc/build
    tags:
      - smoke
      - artifacts
    test:
      - name: Build Docusaurus site
        run: ./bin/aubr -C doc --frozen-lockfile build
